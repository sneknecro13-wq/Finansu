<div id="app"><div class="loading-msg">Завантаження…</div></div>

<script>
const MONTHS_UK = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const STORAGE_KEY = 'finance-transactions-v1';
const CATS_KEY = 'finance-custom-categories-v1';
const BACKUP_URL_KEY = 'finance-backup-url-v1';
const TG_KEY = 'finance-telegram-v1';
const STARTING_BALANCE_KEY = 'finance-starting-balance-v1';

const DEFAULT_CATS = {
  income: ['Зарплата', 'Бізнес', 'Фріланс', 'Повернення парковки', 'Інші доходи'],
  expense: ['Квартира', 'Їжа', 'Транспорт', 'Парковка', 'Комунальні', 'Розваги', 'Здоровʼя', 'Інше'],
  save: ['Заощадження'],
  take: ['Заощадження']
};

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let transactions = [];
let customCategories = { income: [], expense: [], save: [], take: [] };
let startingBalance = 0;
let monthOffset = 0;
let modal = null;
let loaded = false;
let toast = null;
let toastTimer = null;
let backupUrl = null;
let syncTimer = null;
let tgSyncTimer = null;
let telegramConfig = null;
let showParkingHistory = false;

function showToast(msg) {
  toast = msg;
  render();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast = null;
    render();
  }, 3000);
}

function fmt(n) {
  return Math.round(n || 0).toLocaleString('uk-UA');
}

function currentMonthDate() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth() + monthOffset, 1);
}

function monthKey(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
}

function toLocalDateString(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

async function loadData() {
  try {
    if (window.storage) {
      const res = await window.storage.get(STORAGE_KEY, false);
      transactions = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      transactions = raw ? JSON.parse(raw) : [];
    }
  } catch (e) { transactions = []; }

  try {
    if (window.storage) {
      const res = await window.storage.get(STARTING_BALANCE_KEY, false);
      startingBalance = res ? parseFloat(res.value) || 0 : 0;
    } else {
      startingBalance = parseFloat(localStorage.getItem(STARTING_BALANCE_KEY)) || 0;
    }
  } catch (e) { startingBalance = 0; }

  try {
    if (window.storage) {
      const res = await window.storage.get(CATS_KEY, false);
      customCategories = res ? JSON.parse(res.value) : { income: [], expense: [], save: [], take: [] };
    } else {
      const raw = localStorage.getItem(CATS_KEY);
      customCategories = raw ? JSON.parse(raw) : { income: [], expense: [], save: [], take: [] };
    }
  } catch (e) { customCategories = { income: [], expense: [], save: [], take: [] }; }

  let seeded = false;
  Object.keys(DEFAULT_CATS).forEach((type) => {
    const existing = customCategories[type] || [];
    if (!Array.isArray(customCategories[type])) seeded = true;
    const merged = DEFAULT_CATS[type].concat(existing.filter((c) => !DEFAULT_CATS[type].includes(c)));
    if (merged.length !== existing.length || !Array.isArray(customCategories[type])) seeded = true;
    customCategories[type] = merged;
  });
  if (seeded) saveCategories();
  loaded = true;
  render();
}

async function saveData() {
  try {
    if (window.storage) await window.storage.set(STORAGE_KEY, JSON.stringify(transactions), false);
    else localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  } catch (e) { console.error(e); }
  scheduleCloudSync();
  scheduleTelegramSync();
}

async function saveStartingBalance(val) {
  startingBalance = val;
  try {
    if (window.storage) await window.storage.set(STARTING_BALANCE_KEY, String(val), false);
    else localStorage.setItem(STARTING_BALANCE_KEY, String(val));
  } catch (e) { console.error(e); }
  scheduleCloudSync();
  scheduleTelegramSync();
}

async function saveCategories() {
  try {
    if (window.storage) await window.storage.set(CATS_KEY, JSON.stringify(customCategories), false);
    else localStorage.setItem(CATS_KEY, JSON.stringify(customCategories));
  } catch (e) { console.error(e); }
  scheduleCloudSync();
  scheduleTelegramSync();
}

async function loadBackupUrl() {
  try {
    if (window.storage) { const res = await window.storage.get(BACKUP_URL_KEY, false); backupUrl = res ? res.value : null; }
    else backupUrl = localStorage.getItem(BACKUP_URL_KEY) || null;
  } catch (e) { backupUrl = null; }
  if (loaded) render();
}

async function saveBackupUrl(url) {
  backupUrl = url || null;
  try {
    if (window.storage) {
      if (backupUrl) await window.storage.set(BACKUP_URL_KEY, backupUrl, false);
      else await window.storage.set(BACKUP_URL_KEY, "", false);
    } else {
      if (backupUrl) localStorage.setItem(BACKUP_URL_KEY, backupUrl);
      else localStorage.removeItem(BACKUP_URL_KEY);
    }
  } catch (e) { console.error(e); }
}


function scheduleTelegramSync() {
  if (telegramConfig && telegramConfig.token && telegramConfig.chatId) {
    clearTimeout(tgSyncTimer
