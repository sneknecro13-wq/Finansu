        <div class="jobs-cat-pill">🛠️ Шабашка борг: <b>${fmt(shabashkaDebt)} грн</b></div>
      </div>
      <div class="split-row" style="margin-top:12px; gap:12px;">
        <div class="split-col">
          <div class="summary-label">Замовлено</div>
          <div class="split-value" style="font-size:17px;">${fmt(totalOrderedPeriod)} грн</div>
        </div>
        <div class="split-col">
          <div class="summary-label">Виплачено</div>
          <div class="split-value income" style="font-size:17px;">+${fmt(totalPaidPeriod)} грн</div>
        </div>
        <div class="split-col">
          <div class="summary-label">Залишок</div>
          <div class="split-value" style="font-size:17px; color:var(--accent);">${fmt(totalRemPeriod)} грн</div>
        </div>
      </div>
    </div>

    ${jobsPeriodMode === 'month' ? `
      <div class="month-nav" style="margin-bottom:14px;">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="month-label">${MONTHS_UK[now.getMonth()] + ' ' + now.getFullYear()}</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
    ` : ''}

    <button class="jobs-add-btn" onclick="openCreateJobModal('Вишка')">
      <span>+ Записати роботу (Вишка / Шабашка)</span>
    </button>

    <div class="jobs-filter-bar">
      <button class="jobs-filter-chip ${jobsStatusFilter === 'all' ? 'active' : ''}" onclick="setJobsFilter('all', null, null)">Усі (${periodJobs.length})</button>
      <button class="jobs-filter-chip ${jobsStatusFilter === 'open' ? 'active' : ''}" onclick="setJobsFilter('open', null, null)">⏳ Не закриті (${periodJobs.filter(j => j.jobStatus !== 'paid').length})</button>
      <button class="jobs-filter-chip ${jobsStatusFilter === 'partial' ? 'active' : ''}" onclick="setJobsFilter('partial', null, null)">🌓 Частково (${periodJobs.filter(j => j.jobStatus === 'partial').length})</button>
      <button class="jobs-filter-chip ${jobsStatusFilter === 'paid' ? 'active' : ''}" onclick="setJobsFilter('paid', null, null)">✅ Оплачені (${periodJobs.filter(j => j.jobStatus === 'paid').length})</button>
    </div>

    <div class="jobs-filter-bar" style="margin-top:-6px; margin-bottom:16px;">
      <button class="jobs-filter-chip ${jobsCatFilter === 'all' ? 'active' : ''}" onclick="setJobsFilter(null, 'all', null)">Всі категорії</button>
      <button class="jobs-filter-chip ${jobsCatFilter === 'Вишка' ? 'active' : ''}" onclick="setJobsFilter(null, 'Вишка', null)">🏗️ Вишка</button>
      <button class="jobs-filter-chip ${jobsCatFilter === 'Шабашка' ? 'active' : ''}" onclick="setJobsFilter(null, 'Шабашка', null)">🛠️ Шабашка</button>
    </div>

    <section class="list-section">
  `;

  if (filteredJobs.length === 0) {
    html += `<div class="empty-state">Немає записів за обраним фільтром. Натисніть «+ Записати роботу», щоб додати виїзд з описом і датою.</div>`;
  } else {
    html += filteredJobs.map(j => {
      const pct = j.initialAmount > 0 ? Math.min(100, Math.round((j.paidTotal / j.initialAmount) * 100)) : 0;
      const badgeCls = j.jobStatus;
      const badgeTxt = j.jobStatus === 'paid'
        ? '✅ Оплачено повністю'
        : (j.jobStatus === 'partial' ? `🌓 Частково (${pct}%)` : '⏳ Очікує оплати');

      return `
        <div class="job-card status-${j.jobStatus}">
          <div class="job-header">
            <div>
              <div class="job-title-row">
                <span class="job-cat-title">${iconFor(j.category)} ${escapeHtml(j.category)}</span>
                <span class="job-status-badge ${badgeCls}">${badgeTxt}</span>
              </div>
              <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">
                Сума роботи: <b>${fmt(j.initialAmount)} грн</b> • Отримано: <b style="color:var(--income)">${fmt(j.paidTotal)} грн</b>
              </div>
            </div>
            <div class="job-amounts-right">
              ${j.remaining > 0 ? `
                <div class="job-main-amt" style="color:var(--accent)">Борг: ${fmt(j.remaining)} грн</div>
                <div class="job-sub-amt">із ${fmt(j.initialAmount)} грн</div>
              ` : `
                <div class="job-main-amt" style="color:var(--income)">+${fmt(j.paidTotal)} грн</div>
                <div class="job-sub-amt">закрито</div>
              `}
            </div>
          </div>

          ${(j.jobLocation || j.jobDesc) ? `
            <div class="job-desc-box">
              ${j.jobLocation ? `<div class="job-desc-line"><span>📍</span><div><b>Де був:</b> ${escapeHtml(j.jobLocation)}</div></div>` : ''}
              ${j.jobDesc ? `<div class="job-desc-line"><span>🛠️</span><div><b>Що робив:</b> ${escapeHtml(j.jobDesc)}</div></div>` : ''}
            </div>
          ` : `
            <div style="margin-bottom:10px;">
              <button class="jobs-filter-chip" style="font-size:12px; padding:5px 10px;" onclick="openJobDetailsModal('${escapeHtml(j.id)}')">✏️ + Додати опис (де був і що робив)</button>
            </div>
          `}

          <div class="bar-track" style="margin-bottom:10px;">
            <div class="bar-fill ${j.jobStatus === 'paid' ? 'income' : ''}" style="width:${pct}%; ${j.jobStatus !== 'paid' ? 'background:var(--accent);' : ''}"></div>
          </div>

          <div class="job-timeline">
            <div class="job-tl-item">
              <div class="job-tl-left">📅 <span>Створено (дата роботи):</span></div>
              <div class="job-tl-right" style="color:var(--text-primary)">${escapeHtml(j.createdAt)} (${fmt(j.initialAmount)} грн)</div>
            </div>
            ${j.payments.map((p, idx) => `
              <div class="job-tl-item">
                <div class="job-tl-left">
                  <span>${p.isRootFinal && j.payments.length === 1 ? '✅' : '💵'}</span>
                  <span>${p.isRootFinal && j.payments.length === 1 ? 'Повна оплата' : `Оплата #${idx + 1}`}: <b>${escapeHtml(p.date)}</b></span>
                </div>
                <div class="job-tl-right" style="color:var(--income)">
                  <span>+${fmt(p.amount)} грн</span>
                  ${p.isChild ? `<button class="tx-btn" style="padding:2px 5px; font-size:12px;" onclick="deleteTransaction('${escapeHtml(p.id)}')" title="Скасувати цей платіж і повернути в борг">↩️</button>` : ''}
                </div>
              </div>
            `).join('')}
            ${j.remaining > 0 ? `
              <div class="job-tl-item">
                <div class="job-tl-left" style="color:var(--accent)">⏳ <span>Залишок до оплати:</span></div>
                <div class="job-tl-right" style="color:var(--accent)">${fmt(j.remaining)} грн</div>
              </div>
            ` : ''}
          </div>

          <div class="job-actions">
            ${j.remaining > 0 ? `
              <button class="job-btn pay" onclick="openConfirmModal('${escapeHtml(j.id)}')">💵 Внести оплату</button>
            ` : ''}
            <button class="job-btn" onclick="openJobDetailsModal('${escapeHtml(j.id)}')">✏️ Деталі / Звірка</button>
            <button class="job-btn del" onclick="deleteTransaction('${escapeHtml(j.id)}')" title="Видалити">🗑️</button>
          </div>
        </div>
      `;
    }).join('');
  }

  html += `</section>`;
  return html;
}

function render() {
  const app = document.getElementById('app');
  if (!loaded) { app.innerHTML = '<div class="loading-msg">Завантаження…</div>'; return; }

  const simState = validateSimulatedState(transactions);
  const available = simState.wallet;
  const totalSavedAllTime = simState.savings;

  let htmlStr = `
    <div class="eyebrow"><span class="bag">💰</span><h1>Фінанси</h1></div>
    <div class="tabs-bar">
      <button class="tab-btn ${activeTab === 'finance' ? 'active' : ''}" onclick="switchTab('finance')">💳 Основна</button>
      <button class="tab-btn ${activeTab === 'jobs' ? 'active' : ''}" onclick="switchTab('jobs')">🛠️ Роботи</button>
      <button class="tab-btn ${activeTab === 'invest' ? 'active' : ''}" onclick="switchTab('invest')">📈 Інвестиції</button>
    </div>
  `;

  if (activeTab === 'invest') {
    htmlStr += renderInvestTab(simState);
  } else if (activeTab === 'jobs') {
    htmlStr += renderJobsTab();
  } else {
    const now = currentMonthDate();
    const key = monthKey(now);
    const monthTx = txForMonth(key);

    const monthConfirmed = monthTx.filter(t => t.status !== 'pending');
    const monthPending = monthOffset === 0 ? transactions.filter(t => t.status === 'pending' && String(t.date || '').slice(0, 7) <= key) : monthTx.filter(t => t.status === 'pending');
    const income = monthConfirmed.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = monthConfirmed.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const saved = monthConfirmed.filter(t => t.type === 'save').reduce((s, t) => s + t.amount, 0);
    const taken = monthConfirmed.filter(t => t.type === 'take').reduce((s, t) => s + t.amount, 0);
    const net = income - expense;

    const pendingIncMonth = monthPending.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const pendingExpMonth = monthPending.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const projectedAvailable = available + pendingIncMonth - pendingExpMonth;

    const incomeGroups = groupSum(monthConfirmed.filter(t => t.type === 'income'));
    const expenseGroups = groupSum(monthConfirmed.filter(t => t.type === 'expense'));
    const maxIncomeCat = incomeGroups.length ? incomeGroups[0][1] : 0;
    const maxExpenseCat = expenseGroups.length ? expenseGroups[0][1] : 0;
    
    const recentTx = [...monthTx].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.id || '').localeCompare(String(a.id || '')));
    const parkingStats = getParkingStats();
    const debtStats = getDebtStats();
    const isDebtView = activeReimbTab === 'debt';
    const curReimbStats = isDebtView ? debtStats : parkingStats;
    const curHistoryOpen = isDebtView ? showDebtHistory : showParkingHistory;

    htmlStr += `
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="month-label">${MONTHS_UK[now.getMonth()] + ' ' + now.getFullYear()}</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="summary-card">
        <div class="summary-row">
          <div class="summary-label">Чистими за місяць</div>
          <div class="summary-net">${net >= 0 ? '+' : ''}${fmt(net)} грн</div>
        </div>
        <div class="summary-row" style="margin-bottom:0">
          <div class="summary-label">Доступно зараз</div>
          <div class="summary-available">${fmt(available)} грн</div>
          ${(pendingIncMonth || pendingExpMonth) ? `<div class="summary-projected">Прогноз з планом: <b>${fmt(projectedAvailable)} грн</b></div>` : ''}
        </div>
        <div class="split-row">
          <div class="split-col"><div class="summary-label">Доходи</div><div class="split-value income">+${fmt(income)} грн</div></div>
          <div class="split-col"><div class="summary-label">Витрати</div><div class="split-value expense">−${fmt(expense)} грн</div></div>
        </div>
        <div class="divider"></div>
        <div class="saved-row">
          <div class="summary-label" style="margin-bottom:0">Відкладено цього місяця</div>
          <div class="saved-value">${fmt(saved - taken)} грн</div>
        </div>
      </div>

      <div class="action-grid">
        <button class="action-btn" onclick="openModal('income')"><div class="action-icon plus">+</div><div class="action-title">Дохід</div></button>
        <button class="action-btn" onclick="openModal('expense')"><div class="action-icon minus">−</div><div class="action-title">Витрата</div></button>
        <button class="action-btn" onclick="openModal('save')"><div class="action-icon save">🏦</div><div class="action-title">Відкласти</div></button>
        <button class="action-btn" onclick="openModal('take')"><div class="action-icon take">↩</div><div class="action-title">Взяти</div></button>
      </div>

      <!-- ВІДЖЕТ КОНТРОЛЮ ПАРКОВКИ ТА БОРГІВ (ОКРЕМИЙ ОБЛІК) -->
      <div class="parking-card">
        <div class="reimb-subtabs">
          <button type="button" class="reimb-subtab ${!isDebtView ? 'active' : ''}" onclick="switchReimbTab('parking')">
            <span>🅿️ Парковка</span>
            ${parkingStats.debt > 0 ? `<span class="reimb-pill-amt">${fmt(parkingStats.debt)}</span>` : ''}
          </button>
          <button type="button" class="reimb-subtab ${isDebtView ? 'active' : ''}" onclick="switchReimbTab('debt')">
            <span>💸 Борг</span>
            ${debtStats.debt > 0 ? `<span class="reimb-pill-amt">${fmt(debtStats.debt)}</span>` : ''}
          </button>
        </div>

        <div class="parking-head">
          <div class="parking-title">${isDebtView ? '💸 Борг (взаєморозрахунки)' : '🅿️ Парковка (взаєморозрахунки)'}</div>
          <div class="parking-status ${curReimbStats.debt > 0 ? 'debt' : 'clear'}">
            ${curReimbStats.debt > 0 ? `Вам винні: ${fmt(curReimbStats.debt)} грн` : '✅ Все повернуто'}
          </div>
        </div>
        <div class="parking-numbers">
          <div class="parking-col">
            <div class="parking-label">${isDebtView ? 'Витрачено вами' : 'Сплачено вами'}</div>
            <div class="parking-val paid">${fmt(curReimbStats.paid)} грн</div>
          </div>
          <div class="parking-col">
            <div class="parking-label">Вже повернули</div>
            <div class="parking-val back">${fmt(curReimbStats.refunded)} грн</div>
          </div>
          <div class="parking-col">
            <div class="parking-label">Залишок боргу</div>
            <div class="parking-val owe">${fmt(curReimbStats.debt)} грн</div>
          </div>
        </div>
        <div class="parking-btn-row">
          ${isDebtView ? `
            <button class="p-btn pay" onclick="openDebtPayModal()">+ Купив / Дав</button>
            <button class="p-btn refund" onclick="openDebtRefundModal()">↩ Повернули гроші</button>
            <button class="p-btn log" onclick="toggleDebtHistory()">${showDebtHistory ? 'Сховати' : 'Історія'}</button>
          ` : `
            <button class="p-btn pay" onclick="openParkingPayModal()">+ Сплатив парковку</button>
            <button class="p-btn refund" onclick="openParkingRefundModal()">↩ Повернули гроші</button>
            <button class="p-btn log" onclick="toggleParkingHistory()">${showParkingHistory ? 'Сховати' : 'Історія'}</button>
          `}
        </div>
        ${curHistoryOpen ? `
          <div class="parking-history">
            ${curReimbStats.history.length ? curReimbStats.history.map(h => `
              <div class="p-hist-item">
                <div>
                  <span class="p-hist-tag ${h._isOut ? 'pay' : 'refund'}">${h._isOut ? (isDebtView ? 'Борг' : 'Сплата') : 'Повернення'}</span>
                  <span style="margin-left:6px; color:var(--text-secondary);">${escapeHtml(h.comment || h.category || (h._isOut ? (isDebtView ? 'Борг' : 'Парковка') : 'Повернення'))}</span>
                  <div style="font-size:11px; color:var(--text-tertiary); margin-top:2px;">${escapeHtml(h.date)}</div>
                </div>
                <div style="font-family:'Sora',sans-serif; font-weight:700; color:${h._isOut ? 'var(--expense)' : 'var(--income)'}">
                  ${h._isOut ? '−' : '+'}${fmt(h.amount)} грн
                </div>
              </div>
            `).join('') : `<div class="empty-state">${isDebtView ? 'Історія боргів порожня' : 'Історія парковок порожня'}</div>`}
          </div>
        ` : ''}
      </div>
    `;

    if (monthPending.length > 0) {
      htmlStr += `
      <section class="list-section">
        <h2 class="section-title">Очікувані операції ⏳</h2>
        <div class="list-item" style="padding:4px 16px">
      `;
      htmlStr += monthPending.map(t => {
        const isInc = t.type === 'income'; const sign = isInc ? '+~' : '−~'; const amtClass = isInc ? 'income' : 'expense';
        return `<div class="tx-row" data-id="${escapeHtml(t.id)}"><div class="tx-meta"><div class="tx-cat">${iconFor(t.category)} ${escapeHtml(t.category)} <span style="font-size:12px; color:var(--accent); font-weight:normal">(${isInc ? 'дохід' : 'витрата'})</span></div><div class="tx-date">План: ${escapeHtml(t.date)}</div></div><div class="tx-right"><div class="list-item-amount ${amtClass}">${sign}${fmt(t.amount)} грн</div><button class="tx-btn confirm-btn" data-id="${escapeHtml(t.id)}" title="Підтвердити факт">✅</button><button class="tx-btn edit-tx" data-id="${escapeHtml(t.id)}" title="Редагувати">✏️</button><button class="tx-btn del-tx" data-id="${escapeHtml(t.id)}" title="Видалити">✕</button></div></div>`;
      }).join('');
      htmlStr += `
        </div>
      </section>
      `;
    }

    htmlStr += `
      <section class="list-section">
        <h2 class="section-title">Загальні заощадження</h2>
        <div class="list-item"><div class="list-item-top"><div class="list-item-name">🏦 Відкладено всього</div><div class="list-item-amount" style="color:var(--save)">${fmt(totalSavedAllTime)} грн</div></div></div>
      </section>

      <section class="list-section">
        <button type="button" class="dropdown-header ${showIncomeCats ? 'open' : ''}" onclick="toggleIncomeCats()">
          <div class="dropdown-title-wrap">
            <span class="dropdown-title">Доходи за місяць</span>
            ${incomeGroups.length ? `<span class="dropdown-count">(${incomeGroups.length})</span>` : ''}
          </div>
          <div class="dropdown-right">
            <span class="dropdown-sum income">+${fmt(income)} грн</span>
            <span class="dropdown-chevron">▼</span>
          </div>
        </button>
    `;
    if (showIncomeCats) {
      htmlStr += incomeGroups.length ? incomeGroups.map(([cat, amt]) => `<div class="list-item"><div class="list-item-top"><div class="list-item-name">${iconFor(cat)} ${escapeHtml(cat)}</div><div class="list-item-amount income">+${fmt(amt)} грн</div></div><div class="pct-label">${income ? Math.round(amt / income * 100) : 0}% від усіх доходів</div><div class="bar-track"><div class="bar-fill income" style="width:${maxIncomeCat ? (amt / maxIncomeCat * 100) : 0}%"></div></div></div>`).join('') : '<div class="empty-state">Ще немає доходів за цей місяць</div>';
    }
    
    htmlStr += `</section><section class="list-section">
        <button type="button" class="dropdown-header ${showExpenseCats ? 'open' : ''}" onclick="toggleExpenseCats()">
          <div class="dropdown-title-wrap">
            <span class="dropdown-title">Витрати по категоріях</span>
            ${expenseGroups.length ? `<span class="dropdown-count">(${expenseGroups.length})</span>` : ''}
          </div>
          <div class="dropdown-right">
            <span class="dropdown-sum expense">−${fmt(expense)} грн</span>
            <span class="dropdown-chevron">▼</span>
          </div>
        </button>
    `;
    if (showExpenseCats) {
      htmlStr += expenseGroups.length ? expenseGroups.map(([cat, amt]) => `<div class="list-item"><div class="list-item-top"><div class="list-item-name">${iconFor(cat)} ${escapeHtml(cat)}</div><div class="list-item-amount expense">${fmt(amt)} грн</div></div><div class="pct-label">${expense ? Math.round(amt / expense * 100) : 0}% від усіх витрат</div><div class="bar-track"><div class="bar-fill expense" style="width:${maxExpenseCat ? (amt / maxExpenseCat * 100) : 0}%"></div></div></div>`).join('') : '<div class="empty-state">Ще немає витрат за цей місяць</div>';
    }
    
    htmlStr += `
      </section>
      <section class="list-section">
        <h2 class="section-title">Останні операції</h2>
        <div class="list-item scroll-area">
    `;
    htmlStr += recentTx.length ? recentTx.map(t => {
      const isPending = t.status === 'pending';
      const sign = isPending ? '⏳ ' : (t.type === 'income' || t.type === 'invest_out' ? '+' : t.type === 'expense' || t.type === 'invest_in' ? '−' : t.type === 'save' ? '🏦 ' : '↩ ');
      const amtClass = isPending ? 'pending' : (t.type === 'income' || t.type === 'invest_out' ? 'income' : t.type === 'expense' || t.type === 'invest_in' ? 'expense' : '');
      const extraTag = isParkingExpenseTx(t)
        ? ' • <span style="color:var(--accent)">🅿️ парковка</span>'
        : (isParkingRefundTx(t)
          ? ' • <span style="color:var(--income)">↩️ повернення парковки</span>'
          : (isDebtExpenseTx(t)
            ? ' • <span style="color:var(--accent)">💸 борг</span>'
            : (isDebtRefundTx(t)
              ? ' • <span style="color:var(--income)">↩️ повернення боргу</span>'
              : (t.type === 'invest_in'
                ? ' • <span style="color:var(--accent)">📈 в інвестиції</span>'
                : (t.type === 'invest_out' ? ' • <span style="color:var(--income)">📈 з інвестицій</span>' : '')))));
      return `<div class="tx-row" data-id="${escapeHtml(t.id)}"><div class="tx-meta"><div class="tx-cat">${iconFor(t.category)} ${escapeHtml(t.category)} ${t.comment ? `<span style="font-size:12px;color:var(--text-secondary)">(${escapeHtml(t.comment)})</span>` : ''}</div><div class="tx-date">${escapeHtml(t.date)}${extraTag} ${isPending ? '• <i>не зараховано</i>' : ''}</div></div><div class="tx-right"><div class="list-item-amount ${amtClass}">${sign}${fmt(t.amount)} грн</div><button class="tx-btn edit-tx" data-id="${escapeHtml(t.id)}" title="Редагувати">✏️</button><button class="tx-btn del-tx" data-id="${escapeHtml(t.id)}" title="Видалити">✕</button></div></div>`;
    }).join('') : '<div class="empty-state">Немає операцій у цьому місяці</div>';
    htmlStr += `
        </div>
      </section>
      <div class="backup-row">

      </div>

  }

  if (modal) { htmlStr += renderModal(); }
  if (toast) { htmlStr += `<div class="toast">${escapeHtml(toast)}</div>`; }

  app.innerHTML = htmlStr;

  document.querySelectorAll('.edit-tx').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(btn.dataset.id); }); });
  document.querySelectorAll('.confirm-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openConfirmModal(btn.dataset.id); }); });

  document.querySelectorAll('.tx-row[data-id]').forEach(row => { row.addEventListener('click', (e) => { if (e.target.closest('button')) return; openEditModal(row.dataset.id); }); });
  attachModalListeners();
}

function exportData() {
  const payload = { transactions, customCategories, categoryIcons, investAssets, investHistory, startingBalance, investStartingBalance };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `finance-backup-${toLocalDateString(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✅ Бекап успішно завантажено');
}

function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      startingBalance = typeof parsed.startingBalance === 'number' ? parsed.startingBalance : 0;
      saveStartingBalance(startingBalance);
      investStartingBalance = typeof parsed.investStartingBalance === 'number' ? parsed.investStartingBalance : 0;
      saveInvestStartingBalance(investStartingBalance);

      transactions = Array.isArray(parsed) ? parsed : (parsed.transactions || []);
      saveData();

      if (parsed.customCategories) {
        customCategories = parsed.customCategories;
        saveCategories();
      }
      if (parsed.categoryIcons) {
        categoryIcons = { ...DEFAULT_CATEGORY_ICONS, ...parsed.categoryIcons };
        saveCategoryIcons();
      }
      if (Array.isArray(parsed.investAssets)) investAssets = parsed.investAssets;
      if (Array.isArray(parsed.investHistory)) investHistory = parsed.investHistory;
      saveInvestments();

      render();
      showToast('✅ Дані успішно відновлено начисто!');
    } catch (e) { showToast('❌ Не вдалося прочитати файл бекапу'); }
  };
  reader.readAsText(file); event.target.value = '';
}

      </form>
    </div>
  </div>`;
  
  return modalHtml;
}

function changeMonth(delta) { monthOffset += delta; render(); }

loadData(); loadBackupUrl(); loadTelegramConfig();
