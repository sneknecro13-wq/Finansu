<!DOCTYPE html>
<html lang="uk">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фінанси</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фінанси">
<link rel="apple-touch-icon" href="1.png">
<link rel="icon" type="image/png" sizes="192x192" href="1.png">
<link rel="icon" type="image/png" sizes="512x512" href="2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161c;
    --bg-elevated: #1c1f28;
    --bg-elevated-2: #232733;
    --stroke: #2b2f3b;
    --text-primary: #f2f3f5;
    --text-secondary: #8b90a0;
    --text-tertiary: #5c6070;
    --accent: #d4a24c;
    --accent-dim: #d4a24c22;
    --income: #4ade8a;
    --income-dim: #4ade8a1a;
    --expense: #f2685c;
    --expense-dim: #f2685c1a;
    --save: #5b9bd9;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 100px;
    min-height: 100vh;
  }
  .eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .eyebrow .bag { font-size: 26px; }
  h1 { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-md); padding: 14px 8px; margin-bottom: 16px;
  }
  .month-nav button {
    background: none; border: none; color: var(--text-secondary);
    font-size: 20px; width: 40px; height: 40px; cursor: pointer;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:active { background: var(--bg-elevated-2); }
  .month-label { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 17px; }
  .summary-card {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-lg); padding: 26px 22px; margin-bottom: 16px;
  }
  .summary-row { margin-bottom: 18px; }
  .summary-label { color: var(--text-secondary); font-size: 14px; margin-bottom: 4px; }
  .summary-net { font-size: 17px; font-weight: 600; }
  .summary-available {
    font-family: 'Sora', sans-serif; font-size: 40px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1.1;
  }
  .summary-projected {
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 8px;
    background: var(--bg-elevated-2);
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-block;
    border: 1px solid var(--stroke);
  }
  .summary-projected b { color: var(--text-primary); font-family: 'Sora', sans-serif; }
  .split-row { display: flex; gap: 20px; margin-top: 18px; }
  .split-col { flex: 1; }
  .split-value { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; }
  .split-value.income { color: var(--income); }
  .split-value.expense { color: var(--expense); }
  .divider { height: 1px; background: var(--stroke); margin: 18px 0; }
  .saved-row { display: flex; justify-content: space-between; align-items: center; }
  .saved-value { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; color: var(--save); }
  
  .action-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;
  }
  .action-btn {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-md); padding: 12px 14px; display: flex;
    align-items: center; gap: 12px; cursor: pointer; text-align: left;
    color: var(--text-primary); font-family: 'IBM Plex Sans', sans-serif;
  }
  .action-btn:active { background: var(--bg-elevated-2); }
  .action-icon {
    width: 32px; height: 32px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
    flex-shrink: 0;
  }
  .action-icon.plus { background: var(--income-dim); color: var(--income); }
  .action-icon.minus { background: var(--expense-dim); color: var(--expense); }
  .action-icon.save { background: rgba(91, 155, 217, 0.18); color: var(--save); }
  .action-icon.take { background: var(--accent-dim); color: var(--accent); }
  .action-title { font-weight: 600; font-size: 14px; }

  section.list-section { margin-bottom: 28px; }
  .section-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 12px 2px; }
  .dropdown-header {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--stroke);
    border-radius: var(--radius-md);
    padding: 15px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    color: var(--text-primary);
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .dropdown-header:active { background: var(--bg-elevated-2); }
  .dropdown-header.open { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; margin-bottom: 10px; border-color: #3a3f4f; }
  .dropdown-title-wrap { display: flex; align-items: center; gap: 8px; }
  .dropdown-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16.5px; }
  .dropdown-count { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
  .dropdown-right { display: flex; align-items: center; gap: 10px; }
  .dropdown-sum { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; }
  .dropdown-sum.income { color: var(--income); }
  .dropdown-sum.expense { color: var(--expense); }
  .dropdown-chevron {
    color: var(--text-secondary);
    font-size: 14px;
    transition: transform 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .dropdown-header.open .dropdown-chevron { transform: rotate(180deg); color: var(--text-primary); }
  
  .list-item {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 16px; margin-bottom: 8px;
  }
  
  .scroll-area {
    max-height: 55vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px 16px !important;
  }
  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }

  .list-item-top { display: flex; justify-content: space-between; align-items: center; }
  .list-item-name { font-weight: 500; font-size: 15px; }
  .list-item-amount { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; }
  .list-item-amount.income { color: var(--income); }
  .list-item-amount.expense { color: var(--expense); }
  .list-item-amount.pending { color: var(--accent); }
  .pct-label { color: var(--text-tertiary); font-size: 12.5px; margin: 4px 0 8px; }
  .bar-track { height: 6px; background: var(--bg-elevated-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
  .bar-fill.expense { background: var(--expense); }
  .bar-fill.income { background: var(--income); }

  .empty-state { color: var(--text-tertiary); font-size: 14px; padding: 20px 4px; text-align: center; }
  .tx-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--stroke); cursor: pointer;
  }
  .tx-row:last-child { border-bottom: none; }
  .tx-meta { display: flex; flex-direction: column; gap: 2px; }
  .tx-cat { font-size: 14.5px; font-weight: 500; }
  .tx-date { font-size: 12px; color: var(--text-tertiary); }
  .tx-right { display: flex; align-items: center; gap: 8px; }
  .tx-btn {
    background: none; border: none; color: var(--text-tertiary);
    font-size: 16px; cursor: pointer; padding: 6px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .tx-btn:hover, .tx-btn:active { color: var(--text-primary); background: var(--bg-elevated-2); }
  .tx-btn.confirm-btn { color: var(--accent); }
  .tx-btn.confirm-btn:hover { color: var(--income); }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,11,14,0.75);
    display: flex; align-items: flex-start; justify-content: center; 
    z-index: 50; backdrop-filter: blur(2px); padding: 8vh 16px 16px;
    overflow-y: auto;
  }
  .sheet {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-lg); width: 100%; max-width: 440px;
    padding: 24px 20px;
    animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn { 
    from { transform: scale(0.95) translateY(-10px); opacity: 0; } 
    to { transform: scale(1) translateY(0); opacity: 1; } 
  }
  .sheet-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 19px; margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 13px 14px; color: var(--text-primary);
    font-size: 16px; font-family: 'IBM Plex Sans', sans-serif;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field-checkbox {
    display: flex; align-items: center; gap: 10px; background: var(--bg-elevated-2);
    padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--stroke);
    cursor: pointer; user-select: none;
  }
  .field-checkbox input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
  .field-checkbox span { font-size: 14px; font-weight: 500; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 14px; border-radius: var(--radius-sm);
    border: none; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .btn-cancel { background: var(--bg-elevated-2); color: var(--text-secondary); }
  .btn-confirm { color: #14161c; }
  .btn-confirm.income { background: var(--income); }
  .btn-confirm.expense { background: var(--expense); }
  .btn-confirm.save { background: var(--save); }
  .btn-confirm.take { background: var(--accent); }
  .btn-confirm.edit { background: var(--accent); color: #14161c; }
  .btn-danger { background: var(--expense-dim); color: var(--expense); }
  .loading-msg { text-align: center; color: var(--text-tertiary); padding: 60px 20px; font-size: 14px; }
  .backup-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .backup-btn {
    flex: 1; background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 12px; color: var(--text-secondary);
    font-size: 13px; font-weight: 500; cursor: pointer; text-align: center;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .backup-btn:active { background: var(--bg-elevated-2); }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--bg-elevated-2); border: 1px solid var(--stroke);
    border-radius: 999px; padding: 9px 14px; font-size: 14px;
    color: var(--text-secondary); cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.15s ease;
  }
  .chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip-wrap { position: relative; display: inline-block; }
  .chip-wrap .chip { padding-right: 30px; }
  .chip-del {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 20px; height: 20px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.08); color: var(--text-tertiary);
    font-size: 13px; line-height: 1; cursor: pointer; display: flex;
    align-items: center; justify-content: center; padding: 0;
  }
  .chip-del:active { background: var(--expense-dim); color: var(--expense); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elevated-2); border: 1px solid var(--stroke);
    color: var(--text-primary); padding: 12px 20px; border-radius: 12px;
    font-size: 14px; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: fadeUp 0.2s ease-out;
    white-space: nowrap;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* Вкладки навігації (Фінанси / Роботи / Інвестиції) */
  .tabs-bar {
    display: flex; gap: 8px; background: var(--bg-elevated);
    border: 1px solid var(--stroke); border-radius: var(--radius-md);
    padding: 5px; margin-bottom: 18px;
  }
  .tab-btn {
    flex: 1; padding: 10px 12px; border: none; border-radius: 11px;
    background: transparent; color: var(--text-secondary);
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s ease;
  }
  .tab-btn.active {
    background: var(--bg-elevated-2); color: var(--text-primary);
    border: 1px solid var(--stroke); box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  /* Віджет контролю парковки та боргів */
  .parking-card {
    background: linear-gradient(145deg, #1b212d 0%, #161922 100%);
    border: 1px solid #364157;
    border-radius: var(--radius-lg);
    padding: 18px 18px 16px;
    margin-bottom: 22px;
  }
  .reimb-subtabs {
    display: flex; gap: 6px; background: var(--bg-elevated);
    border: 1px solid var(--stroke); border-radius: 11px;
    padding: 4px; margin-bottom: 12px;
  }
  .reimb-subtab {
    flex: 1; padding: 8px 10px; border: none; border-radius: 8px;
    background: transparent; color: var(--text-secondary);
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s ease;
  }
  .reimb-subtab.active {
    background: var(--bg-elevated-2); color: var(--text-primary);
    border: 1px solid #3d475d;
  }
  .reimb-pill-amt {
    font-size: 11.5px; padding: 2px 7px; border-radius: 999px;
    background: rgba(212, 162, 76, 0.16); color: var(--accent); font-weight: 700;
  }
  .parking-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .parking-title {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .parking-status {
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  }
  .parking-status.debt { background: rgba(242, 104, 92, 0.2); color: var(--expense); border: 1px solid var(--expense); }
  .parking-status.clear { background: rgba(74, 222, 138, 0.18); color: var(--income); border: 1px solid var(--income); }
  
  .parking-numbers {
    display: flex; gap: 10px; margin: 12px 0; background: var(--bg-elevated);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .parking-col { flex: 1; }
  .parking-label { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 2px; }
  .parking-val { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; }
  .parking-val.owe { color: var(--accent); }
  .parking-val.paid { color: var(--expense); }
  .parking-val.back { color: var(--income); }

  .parking-btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .p-btn {
    flex: 1; padding: 10px 8px; border-radius: var(--radius-sm); border: none;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    font-family: 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .p-btn.pay { background: var(--expense-dim); color: var(--expense); border: 1px solid rgba(242, 104, 92, 0.3); }
  .p-btn.refund { background: var(--income-dim); color: var(--income); border: 1px solid rgba(74, 222, 138, 0.3); }
  .p-btn.log { background: var(--bg-elevated-2); color: var(--text-secondary); border: 1px solid var(--stroke); flex: 0.8; }
  .p-btn:active { opacity: 0.85; }

  .parking-history {
    margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--stroke);
    max-height: 220px; overflow-y: auto;
  }
  .p-hist-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .p-hist-item:last-child { border-bottom: none; }
  .p-hist-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .p-hist-tag.pay { background: var(--expense-dim); color: var(--expense); }
  .p-hist-tag.refund { background: var(--income-dim); color: var(--income); }

  /* Вкладка Інвестиції */
  .invest-hero {
    background: linear-gradient(145deg, #211f2c 0%, #171922 100%);
    border: 1px solid #3c3a52;
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    margin-bottom: 16px;
  }
  .invest-total {
    font-family: 'Sora', sans-serif; font-size: 36px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 8px;
  }
  .invest-pnl-badge {
    display: inline-block; padding: 4px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600; font-family: 'Sora', sans-serif;
  }
  .invest-pnl-badge.pos { background: var(--income-dim); color: var(--income); }
  .invest-pnl-badge.neg { background: var(--expense-dim); color: var(--expense); }
  .invest-pnl-badge.flat { background: var(--bg-elevated-2); color: var(--text-secondary); }
  .invest-actions-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
  }
  .invest-buy-btn {
    width: 100%; background: var(--accent-dim); border: 1px solid var(--accent);
    color: var(--accent); border-radius: var(--radius-md); padding: 14px;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px;
    cursor: pointer; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .invest-buy-btn:active { opacity: 0.85; }
  .asset-card {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-md); padding: 15px 16px; margin-bottom: 10px;
  }
  .asset-top {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px;
  }
  .asset-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; }
  .asset-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .asset-val { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; text-align: right; }
  .asset-pnl { font-size: 12px; font-weight: 600; text-align: right; margin-top: 2px; }
  .asset-pnl.pos { color: var(--income); }
  .asset-pnl.neg { color: var(--expense); }
  .asset-pnl.flat { color: var(--text-tertiary); }
  .asset-btns {
    display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--stroke);
  }
  .asset-btn {
    flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--stroke);
    background: var(--bg-elevated-2); color: var(--text-primary);
    font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
  }
  .asset-btn.sell { background: var(--income-dim); color: var(--income); border-color: rgba(74, 222, 138, 0.3); }
  .asset-btn.del { flex: 0.35; color: var(--text-tertiary); }
  .asset-btn:active { opacity: 0.8; }


  /* Вкладка Роботи (Вишка / Шабашка) */
  .jobs-hero {
    background: linear-gradient(145deg, #1f2430 0%, #161922 100%);
    border: 1px solid #364057;
    border-radius: var(--radius-lg);
    padding: 20px 18px;
    margin-bottom: 16px;
  }
  .jobs-debt-total {
    font-family: 'Sora', sans-serif; font-size: 34px; font-weight: 800;
    color: var(--accent); letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 8px;
  }
  .jobs-cat-pills {

async function loadData() {
  try {
    if (window.storage) {
      const res = await window.storage.get(STORAGE_KEY, false);
      transactions = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      transactions = raw ? JSON.parse(raw) : [];
    }
  } catch (e) { transactions = []; }

  try {
    if (window.storage) {
      const res = await window.storage.get(STARTING_BALANCE_KEY, false);
      startingBalance = res ? parseFloat(res.value) || 0 : 0;
    } else {
      startingBalance = parseFloat(localStorage.getItem(STARTING_BALANCE_KEY)) || 0;
    }
  } catch (e) { startingBalance = 0; }

  try {
    if (window.storage) {
      const res = await window.storage.get(CATS_KEY, false);
      customCategories = res ? JSON.parse(res.value) : { income: [], expense: [], save: [], take: [] };
    } else {
      const raw = localStorage.getItem(CATS_KEY);
      customCategories = raw ? JSON.parse(raw) : { income: [], expense: [], save: [], take: [] };
    }
  } catch (e) { customCategories = { income: [], expense: [], save: [], take: [] }; }

  try {
    if (window.storage) {
      const res = await window.storage.get(CATS_ICONS_KEY, false);
      categoryIcons = res ? { ...DEFAULT_CATEGORY_ICONS, ...JSON.parse(res.value) } : { ...DEFAULT_CATEGORY_ICONS };
    } else {
      const raw = localStorage.getItem(CATS_ICONS_KEY);
      categoryIcons = raw ? { ...DEFAULT_CATEGORY_ICONS, ...JSON.parse(raw) } : { ...DEFAULT_CATEGORY_ICONS };
    }
  } catch (e) { categoryIcons = { ...DEFAULT_CATEGORY_ICONS }; }

  try {
    if (window.storage) {
      const res = await window.storage.get(INVEST_ASSETS_KEY, false);
      investAssets = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem(INVEST_ASSETS_KEY);
      investAssets = raw ? JSON.parse(raw) : [];
    }
  } catch (e) { investAssets = []; }

  try {
    if (window.storage) {
      const res = await window.storage.get(INVEST_HISTORY_KEY, false);
      investHistory = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem(INVEST_HISTORY_KEY);
      investHistory = raw ? JSON.parse(raw) : [];
    }
  } catch (e) { investHistory = []; }

  try {
    if (window.storage) {
      const res = await window.storage.get(INVEST_START_KEY, false);
      investStartingBalance = res ? parseFloat(res.value) || 0 : 0;
    } else {
      investStartingBalance = parseFloat(localStorage.getItem(INVEST_START_KEY)) || 0;
    }
  } catch (e) { investStartingBalance = 0; }

  let seeded = false;
  Object.keys(DEFAULT_CATS).forEach((type) => {
    const existing = customCategories[type] || [];
    if (!Array.isArray(customCategories[type])) seeded = true;
    const merged = DEFAULT_CATS[type].concat(existing.filter((c) => !DEFAULT_CATS[type].includes(c)));
    if (merged.length !== existing.length || !Array.isArray(customCategories[type])) seeded = true;
    customCategories[type] = merged;
  });
  if (seeded) saveCategories();
  loaded = true;
  render();
}

async function saveData() {

async function loadBackupUrl() {
  try {
    if (window.storage) { const res = await window.storage.get(BACKUP_URL_KEY, false); backupUrl = res ? res.value : null; }
    else backupUrl = localStorage.getItem(BACKUP_URL_KEY) || null;
  } catch (e) { backupUrl = null; }
  if (loaded) render();
}

async function saveBackupUrl(url) {
  backupUrl = url || null;
  try {
    if (window.storage) {
      if (backupUrl) await window.storage.set(BACKUP_URL_KEY, backupUrl, false);
      else await window.storage.set(BACKUP_URL_KEY, "", false);
    } else {
      if (backupUrl) localStorage.setItem(BACKUP_URL_KEY, backupUrl);
      else localStorage.removeItem(BACKUP_URL_KEY);
    }
  } catch (e) { console.error(e); }
}

function scheduleCloudSync() {
  if (backupUrl) { clearTimeout(syncTimer); syncTimer = setTimeout(cloudSyncNow, 2500); }
}

async function cloudSyncNow() {
  if (!backupUrl) return;
  try {
    await fetch(backupUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transactions, customCategories, categoryIcons, investAssets, investHistory, startingBalance, investStartingBalance, savedAt: new Date().toISOString() })
    });
  } catch (e) { console.error(e); }
}

function setupCloudBackup() {
  modal = { mode: 'setup_cloud' };
  render();
  setTimeout(() => {
    const input = document.getElementById('cloud-url-input');
    if (input) input.focus();
  }, 100);
}

async function submitCloudBackup(e) {
  e.preventDefault();
  const trimmed = e.target['cloud-url'].value.trim();
  if (!trimmed) {
    await saveBackupUrl('');
    closeModal();
    showToast('☁️ Хмарний бекап вимкнено');
    return;
  }
  await saveBackupUrl(trimmed);
  closeModal();
  showToast('✅ Хмарний бекап успішно підключено');
  cloudSyncNow();
}

async function restoreFromCloud() {
  if (!backupUrl) { showToast('❌ Спочатку налаштуй підключення до хмари'); return; }
  try {
    const res = await fetch(backupUrl);
    const parsed = await res.json();
    if (typeof parsed.startingBalance === 'number') saveStartingBalance(parsed.startingBalance);
    if (typeof parsed.investStartingBalance === 'number') saveInvestStartingBalance(parsed.investStartingBalance);
    transactions = parsed.transactions || [];
    if (parsed.customCategories) customCategories = parsed.customCategories;
    if (parsed.categoryIcons) { categoryIcons = { ...DEFAULT_CATEGORY_ICONS, ...parsed.categoryIcons }; saveCategoryIcons(); }
    if (Array.isArray(parsed.investAssets)) investAssets = parsed.investAssets;

  if (telegramConfig && telegramConfig.token && telegramConfig.chatId) {
    clearTimeout(tgSyncTimer);
    tgSyncTimer = setTimeout(telegramSyncNow, 2000);
  }
}

async function telegramSyncNow() {
  if (!telegramConfig || !telegramConfig.token || !telegramConfig.chatId) return;
  try {
    const payload = JSON.stringify({ transactions, customCategories, categoryIcons, investAssets, investHistory, startingBalance, investStartingBalance, savedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const form = new FormData();
    form.append('chat_id', telegramConfig.chatId);
    form.append('document', blob, 'finance-backup.json');
    const res = await fetch(`https://api.telegram.org/bot${telegramConfig.token}/sendDocument`, { method: 'POST', body: form });
    const data = await res.json();
    if (data?.result?.message_id) {
      const prevMessageId = telegramConfig.lastMessageId;
      telegramConfig.lastMessageId = data.result.message_id;
      await saveTelegramConfig(telegramConfig);
      if (prevMessageId) {
        const delForm = new FormData();
        delForm.append('chat_id', telegramConfig.chatId);
        delForm.append('message_id', prevMessageId);
        fetch(`https://api.telegram.org/bot${telegramConfig.token}/deleteMessage`, {
          method: 'POST',
          body: delForm
        }).catch(() => {});
      }
    }
  } catch (e) { console.error(e); }
}

function validateSimulatedState(proposedTx, proposedAssets = investAssets, proposedHistory = investHistory, customStart = startingBalance, customInvestStart = investStartingBalance) {
  const confirmed = proposedTx.filter(t => t.status !== 'pending');
  const inc = confirmed.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const exp = confirmed.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const sav = confirmed.filter(t => t.type === 'save').reduce((s, t) => s + t.amount, 0);
  const tak = confirmed.filter(t => t.type === 'take').reduce((s, t) => s + t.amount, 0);
  const invIn = confirmed.filter(t => t.type === 'invest_in').reduce((s, t) => s + t.amount, 0);
  const invOut = confirmed.filter(t => t.type === 'invest_out').reduce((s, t) => s + t.amount, 0);

  const boughtSum = proposedHistory.filter(h => h.action === 'buy').reduce((s, h) => s + h.amount, 0);
  const soldSum = proposedHistory.filter(h => h.action === 'sell').reduce((s, h) => s + h.amount, 0);

  return {
    savings: sav - tak,
    wallet: customStart + inc - exp - sav + tak - invIn + invOut,
    investCash: customInvestStart + invIn - invOut - boughtSum + soldSum
  };
}

  if (!target) return false;

  let returnToPending = false;
  let parentPending = null;
  if (target.parentPendingId) {
    parentPending = transactions.find(t => t.id === target.parentPendingId);
    if (parentPending) {
      returnToPending = true;
    }
  }

  modal = {

    returnToPending: returnToPending,
    parentPending: parentPending
  };
  render();
  return true;
}

function executeDelete(id, returnToPending, parentPendingId) {
  const target = transactions.find(t => t.id === id);
  if (!target) { closeModal(); return; }

  let proposedTx = transactions.filter(t => t.id !== id);
  if (returnToPending && parentPendingId) {
    const parentObj = proposedTx.find(t => t.id === parentPendingId);
    if (parentObj) {
      if (parentObj.status === 'pending') {
        proposedTx = proposedTx.map(t => t.id === parentPendingId ? {
          ...t,
          amount: Math.round((t.amount + target.amount) * 100) / 100
        } : t);
      } else {
        const finalPayChild = {
          id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
          type: parentObj.type,
          amount: parentObj.amount,
          category: parentObj.category,
          date: parentObj.confirmedAt || parentObj.date,
          confirmedAt: parentObj.confirmedAt || parentObj.date,
          createdAt: parentObj.createdAt || parentObj.plannedDate || parentObj.date,
          status: 'confirmed',
          comment: (parentObj.jobLocation || parentObj.comment || parentObj.category) + ' (частина)',
          parentPendingId: parentObj.id
        };
        proposedTx.unshift(finalPayChild);
        proposedTx = proposedTx.map(t => t.id === parentPendingId ? {
          ...t,
          status: 'pending',
          amount: target.amount,
          date: t.createdAt || t.plannedDate || t.date,
          confirmedAt: null
        } : t);
      }
    }
  }

  const sim = validateSimulatedState(proposedTx);
  if (sim.savings < 0) {
    showToast(`❌ Неможливо видалити: скарбничка піде в мінус (${fmt(sim.savings)} грн)`);
    closeModal();
    return;
  }
  if (sim.wallet < 0) {
    showToast(`❌ Неможливо видалити: гаманець піде в мінус (${fmt(sim.wallet)} грн)`);
    closeModal();
    return;
  }
  if (sim.investCash < 0) {
    showToast(`❌ Неможливо видалити: вільний кеш в інвестиціях піде в мінус (${fmt(sim.investCash)} грн)`);
    closeModal();
    return;
  }

  transactions = proposedTx;
  saveData();
  closeModal();
  if (returnToPending) {
    showToast(`🗑️ Видалено! ${fmt(target.amount)} грн повернено в очікувані`);
  } else {
    showToast('🗑️ Запис успішно видалено!');
  }
}

/* ================== ПАРКОВКА ТА БОРГ (ОКРЕМІ ВЗАЄМОРОЗРАХУНКИ) ================== */
function isParkingExpenseTx(t) {
  return Boolean(t.isParking) && !t.isDebt && !t.isDebtRefund;
}

function isParkingRefundTx(t) {
  return Boolean(t.isParkingRefund) && !t.isDebt && !t.isDebtRefund;
}

function isDebtExpenseTx(t) {
  return Boolean(t.isDebt) && !t.isParking && !t.isParkingRefund;
}

function isDebtRefundTx(t) {
  return Boolean(t.isDebtRefund) && !t.isParking && !t.isParkingRefund;
}

function getParkingStats() {
  const confirmed = transactions.filter(t => t.status !== 'pending');
  const paid = confirmed.filter(isParkingExpenseTx).reduce((s, t) => s + t.amount, 0);
  const refunded = confirmed.filter(isParkingRefundTx).reduce((s, t) => s + t.amount, 0);
  const debt = paid - refunded;
  const history = confirmed
    .filter(t => isParkingExpenseTx(t) || isParkingRefundTx(t))
    .map(t => ({ ...t, _isOut: isParkingExpenseTx(t) }))
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.id || '').localeCompare(String(a.id || '')));
  return { paid, refunded, debt, history };
}

function getDebtStats() {
  const confirmed = transactions.filter(t => t.status !== 'pending');
  const paid = confirmed.filter(isDebtExpenseTx).reduce((s, t) => s + t.amount, 0);
  const refunded = confirmed.filter(isDebtRefundTx).reduce((s, t) => s + t.amount, 0);
  const debt = paid - refunded;
  const history = confirmed
    .filter(t => isDebtExpenseTx(t) || isDebtRefundTx(t))
    .map(t => ({ ...t, _isOut: isDebtExpenseTx(t) }))
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.id || '').localeCompare(String(a.id || '')));
  return { paid, refunded, debt, history };
}

/* ================== РОБОТИ (ВИШКА / ШАБАШКА) ================== */
function isJobCategory(cat) {
  const c = String(cat || '').trim().toLowerCase();
  return c === 'вишка' || c === 'шабашка' || c === 'підробіток';
}

function getAllJobsList() {
  const rootCandidates = transactions.filter(t => {
    if (t.type !== 'income') return false;
    if (t.parentPendingId) return false;
    if (isParkingRefundTx(t) || isDebtRefundTx(t)) return false;
    const hasChildren = transactions.some(c => c.parentPendingId === t.id);
    return Boolean(t.isJob || t.status === 'pending' || isJobCategory(t.category) || hasChildren);
  });

  return rootCandidates.map(t => {
    const children = transactions
      .filter(c => c.parentPendingId === t.id && c.status !== 'pending')
      .sort((a, b) => String(a.confirmedAt || a.date || '').localeCompare(String(b.confirmedAt || b.date || '')) || String(a.id || '').localeCompare(String(b.id || '')));

    const childrenPaid = Math.round(children.reduce((s, c) => s + (c.amount || 0), 0) * 100) / 100;
    const isPending = t.status === 'pending';
    const remaining = isPending ? Math.round((t.amount || 0) * 100) / 100 : 0;
    const paidTotal = isPending ? childrenPaid : Math.round((childrenPaid + (t.amount || 0)) * 100) / 100;
    const computedInitial = Math.round((paidTotal + remaining) * 100) / 100;
    const initialAmount = t.initialAmount ? Math.max(t.initialAmount, computedInitial) : computedInitial;
    const createdAt = t.createdAt || t.plannedDate || t.date;
    const closedAt = !isPending ? (t.confirmedAt || t.date) : null;

    let jobStatus = 'unpaid';
    if (!isPending || remaining <= 0) jobStatus = 'paid';
    else if (paidTotal > 0) jobStatus = 'partial';

    const payments = children.map((c, idx) => ({
      id: c.id,
      date: c.confirmedAt || c.date,
      amount: c.amount,
      note: c.comment || `Частина #${idx + 1}`,
      isChild: true
    }));

    if (!isPending) {
      payments.push({
        id: t.id,
        date: t.confirmedAt || t.date,
        amount: t.amount,
        note: children.length > 0 ? 'Остаточний розрахунок' : (t.comment || 'Повна оплата'),
        isRootFinal: true
      });
    }

    return {
      tx: t,
      id: t.id,
      category: t.category,
      createdAt,
      closedAt,
      initialAmount,
      paidTotal,
      remaining,
      jobStatus,
      jobLocation: t.jobLocation || '',
      jobDesc: t.jobDesc || t.comment || '',
      payments,
      children
    };
  }).sort((a, b) => {
    const aOpen = a.jobStatus !== 'paid' ? 1 : 0;
    const bOpen = b.jobStatus !== 'paid' ? 1 : 0;
    if (aOpen !== bOpen) return bOpen - aOpen;
    return String(b.createdAt || '').localeCompare(String(a.createdAt || '')) || String(b.id || '').localeCompare(String(a.id || ''));
  });
}

function submitCreateJob(e) {
  e.preventDefault();
  const form = e.target;
  const category = form['job-category'].value || 'Вишка';
  const rawTotal = form['job-total'].value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
  const totalAmount = parseFloat(rawTotal);
  const createdAt = form['job-created-date'].value || toLocalDateString(new Date());
  const jobLocation = form['job-location'].value.trim();
  const jobDesc = form['job-desc'].value.trim();
  const payMode = form['job-pay-mode'].value;

  if (!totalAmount || totalAmount <= 0) {
    showToast('❌ Введіть загальну суму роботи більше нуля');
    return;
  }

  const shortComment = '';
  const jobId = Date.now() + '-' + Math.random().toString(36).slice(2, 7);

  if (payMode === 'unpaid') {
    transactions.unshift({
      id: jobId,
      type: 'income',
      category,
      amount: totalAmount,
      initialAmount: totalAmount,
      date: createdAt,
      createdAt: createdAt,
      plannedDate: createdAt,
      status: 'pending',
      isJob: true,
      jobLocation,
      jobDesc,
      comment: shortComment
    });
    saveData();
    closeModal();
    showToast(`⏳ Роботу «${category}» (${fmt(totalAmount)} грн) додано в очікувані!`);
    return;
  }

  if (payMode === 'paid') {
    const paidDate = form['job-paid-date'].value || createdAt;
    transactions.unshift({
      id: jobId,
      type: 'income',
      category,
      amount: totalAmount,
      initialAmount: totalAmount,
      date: paidDate,
      createdAt: createdAt,
      plannedDate: createdAt,
      confirmedAt: paidDate,
      status: 'confirmed',
      isJob: true,
      jobLocation,
      jobDesc,
      comment: shortComment
    });
    saveData();
    closeModal();
    showToast(`✅ Роботу «${category}» (+${fmt(totalAmount)} грн) зараховано!`);
    return;
  }

  const rawAdvance = form['job-advance-amount'].value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
  const advanceAmount = parseFloat(rawAdvance);
  const paidDate = form['job-paid-date'].value || createdAt;

  if (!advanceAmount || advanceAmount <= 0 || advanceAmount >= totalAmount) {
    showToast('❌ Сума часткової оплати має бути більшою за 0 і меншою за загальну суму');
    return;
  }

  const remaining = Math.round((totalAmount - advanceAmount) * 100) / 100;

  transactions.unshift({
    id: jobId,
    type: 'income',
    category,
    amount: remaining,
    initialAmount: totalAmount,
    date: createdAt,
    createdAt: createdAt,
    plannedDate: createdAt,
    status: 'pending',
    isJob: true,
    jobLocation,
    jobDesc,
    comment: shortComment
  });

  transactions.unshift({
    id: Date.now() + 1 + '-' + Math.random().toString(36).slice(2, 7),
    type: 'income',
    category,
    amount: advanceAmount,
    date: paidDate,
    createdAt: createdAt,
    confirmedAt: paidDate,
    status: 'confirmed',
    comment: (jobLocation ? `${jobLocation} (частина)` : `Частина від ${createdAt}`),
    parentPendingId: jobId
  });

  saveData();
  closeModal();
  showToast(`🌓 Зараховано +${fmt(advanceAmount)} грн, залишок ${fmt(remaining)} грн в очікуванні!`);
}

function submitJobDetails(e) {
  e.preventDefault();
  const form = e.target;
  const job = modal.job;
  const category = form['job-category'].value || job.category;
  const createdAt = form['job-created-date'].value || job.createdAt;
  const jobLocation = form['job-location'].value.trim();
  const jobDesc = form['job-desc'].value.trim();
  const rawInitial = form['job-initial-amount'].value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
  const newInitial = parseFloat(rawInitial);

  if (!newInitial || newInitial <= 0) {
    showToast('❌ Вкажіть коректну суму замовлення');
    return;
  }

  const shortComment = '';
  const isPending = job.tx.status === 'pending';

  let updatedFields = {
    category,
    createdAt,
    plannedDate: createdAt,
    initialAmount: newInitial,
    isJob: true,
    jobLocation,
    jobDesc,
    comment: shortComment
  };

  if (isPending) {
    const newRemaining = Math.max(0, Math.round((newInitial - job.paidTotal) * 100) / 100);
    updatedFields.date = createdAt;
    if (newRemaining === 0 && job.paidTotal > 0) {
      updatedFields.amount = 0;
    } else {
      updatedFields.amount = newRemaining;
    }
  } else {
    if (form['job-paid-date'] && form['job-paid-date'].value) {
      updatedFields.confirmedAt = form['job-paid-date'].value;
      updatedFields.date = form['job-paid-date'].value;
    }
    if (job.children.length === 0) {
      updatedFields.amount = newInitial;
    } else {
      updatedFields.amount = Math.max(0, Math.round((newInitial - job.children.reduce((s, c) => s + c.amount, 0)) * 100) / 100);
    }
  }

  let proposedTx = transactions.map(t => t.id === job.id ? { ...t, ...updatedFields } : t);
  const sim = validateSimulatedState(proposedTx);
  if (sim.wallet < 0) {
    showToast(`❌ Відхилено: гаманець піде в мінус (${fmt(sim.wallet)} грн)`);
    return;
  }

  transactions = proposedTx;
  saveData();
  closeModal();
  showToast('✅ Деталі роботи оновлено!');
}

function reopenClosedJobToPending(jobId) {

  if (!job || job.tx.status === 'pending') return;

  const proposedTx = transactions.map(t => t.id === jobId ? {
    ...t,
    status: 'pending',
    date: job.createdAt,
    confirmedAt: null
  } : t);

  if (sim.wallet < 0) {
    showToast(`❌ Неможливо повернути в борг: гаманець піде в мінус (${fmt(sim.wallet)} грн)`);

function linkStandalonePaymentToJob(paymentTxId, jobId) {
  const payTx = transactions.find(t => t.id === paymentTxId);
  const jobTx = transactions.find(t => t.id === jobId);
  if (!payTx || !jobTx) return;

  transactions = transactions.map(t => {
    if (t.id === paymentTxId) {
      return {
        ...t,
        parentPendingId: jobId,
        createdAt: jobTx.createdAt || jobTx.plannedDate || jobTx.date,
        confirmedAt: t.confirmedAt || t.date
      };
    }
    if (t.id === jobId && t.status === 'pending') {
      const curInit = t.initialAmount || t.amount;
      const newRem = Math.max(0, Math.round((t.amount - payTx.amount) * 100) / 100);
      return {
        ...t,
        initialAmount: curInit,
        amount: newRem,
        status: newRem === 0 ? 'confirmed' : 'pending'
      };
    }
    return t;
  });

  saveData();
  openJobDetailsModal(jobId);
  showToast(`🔗 Платіж +${fmt(payTx.amount)} грн привʼязано до роботи!`);
}

/* ================== ІНВЕСТИЦІЇ ================== */
function parseQtyNum(qStr) {
  if (!qStr) return NaN;
  const m = String(qStr).replace(',', '.').match(/[0-9]+(?:\.[0-9]+)?/);
  return m ? parseFloat(m[0]) : NaN;
}

function getDuplicateAssetGroups() {
  const map = {};
  investAssets.forEach(a => {
    const k = (a.assetType || 'tokens') + '::' + (a.name || '').trim().toLowerCase();
    if (!map[k]) map[k] = [];
    map[k].push(a);
  });
  return Object.values(map).filter(arr => arr.length > 1);
}

function mergeDuplicateAssets() {
  const groups = getDuplicateAssetGroups();
  if (!groups.length) return;
  const newAssets = [];
  const processedIds = new Set();

  for (const a of investAssets) {
    if (processedIds.has(a.id)) continue;
    const k = (a.assetType || 'tokens') + '::' + (a.name || '').trim().toLowerCase();
    const matches = investAssets.filter(x => ((x.assetType || 'tokens') + '::' + (x.name || '').trim().toLowerCase()) === k);
    if (matches.length > 1) {
      let totalCost = 0;
      let totalCur = 0;
      let totalQty = 0;
      let hasQty = true;
      const notes = [];
      matches.forEach(m => {
        processedIds.add(m.id);
        totalCost += (m.investedAmount || 0);
        totalCur += (m.currentValue ?? m.investedAmount ?? 0);
        const qn = parseQtyNum(m.quantity);
        if (!isNaN(qn)) totalQty += qn;
        else if (m.quantity) hasQty = false;
        if (m.note) notes.push(m.note);
      });
      const first = matches[0];
      newAssets.push({
        ...first,
        investedAmount: Math.round(totalCost * 100) / 100,
        currentValue: Math.round(totalCur * 100) / 100,
        quantity: hasQty && totalQty > 0 ? String(Math.round(totalQty * 1000000) / 1000000) : first.quantity,
        note: [...new Set(notes)].join('; ')
      });
    } else {
      processedIds.add(a.id);
      newAssets.push(a);
    }
  }
  investAssets = newAssets;
  saveInvestments();
  render();
  showToast('🔗 Однакові активи успішно обʼєднано!');
}

function submitSwapAsset(e) {
  e.preventDefault();
  const form = e.target;
  const src = modal.asset;
  const targetType = modal.selectedType || 'allocation';
  const targetName = form['target-name'].value.trim();
  const targetQty = form['target-qty'].value.trim();
  const isPendingAlloc = form['is-alloc-pending'] ? form['is-alloc-pending'].checked : false;
  const dateStr = form['swap-date'].value || toLocalDateString(new Date());
  const note = form['swap-note'].value.trim();

  if (!targetName) { showToast('❌ Введіть назву цільового активу'); return; }

  const srcQtyNum = parseQtyNum(src.quantity);
  let spendCost = src.investedAmount;
  let spendCur = src.currentValue ?? src.investedAmount;
  let remainQtyStr = '';
  let fullySpent = false;

  if (!isNaN(srcQtyNum) && srcQtyNum > 0 && form['spend-qty']) {
    const rawSpendQty = form['spend-qty'].value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
    const spendQty = parseFloat(rawSpendQty);
    if (!spendQty || spendQty <= 0 || spendQty > srcQtyNum + 0.000001) {
      showToast(`❌ Вкажіть коректну кількість (від 0 до ${srcQtyNum})`);
      return;
    }
    const ratio = Math.min(1, spendQty / srcQtyNum);
    if (ratio >= 0.9999) {
      fullySpent = true;
    } else {
      spendCost = Math.round(src.investedAmount * ratio * 100) / 100;
      spendCur = Math.round((src.currentValue ?? src.investedAmount) * ratio * 100) / 100;
      const rem = Math.round((srcQtyNum - spendQty) * 1000000) / 1000000;
      remainQtyStr = String(rem);
    }
  } else {
    const rawSpendUah = form['spend-uah'].value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
    const spendUah = parseFloat(rawSpendUah);
    if (!spendUah || spendUah <= 0 || spendUah > src.investedAmount + 0.01) {
      showToast(`❌ Вкажіть коректну суму (до ${fmt(src.investedAmount)} грн)`);
      return;
    }
    if (spendUah >= src.investedAmount - 0.01) {
      fullySpent = true;
    } else {
      const ratio = spendUah / src.investedAmount;
      spendCost = spendUah;
      spendCur = Math.round((src.currentValue ?? src.investedAmount) * ratio * 100) / 100;
    }
  }

  if (fullySpent) {
    investAssets = investAssets.filter(a => a.id !== src.id);
  } else {
    investAssets = investAssets.map(a => a.id === src.id ? {
      ...a,
      investedAmount: Math.max(0, Math.round((a.investedAmount - spendCost) * 100) / 100),
      currentValue: Math.max(0, Math.round(((a.currentValue ?? a.investedAmount) - spendCur) * 100) / 100),
      quantity: remainQtyStr || a.quantity
    } : a);
  }

  investAssets.unshift({
    id: 'asset_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    assetType: targetType,
    name: targetName,
    quantity: targetQty,
    investedAmount: spendCost,
    currentValue: spendCur,
    date: dateStr,
    note: note || `З ${src.name}`,
    isAllocPending: isPendingAlloc,
    sourceAssetName: src.name
  });

  investHistory.unshift({
    id: 'ih_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    action: 'swap',
    assetName: `${src.name} → ${targetName}`,
    assetType: targetType,
    amount: spendCost,
    pnl: 0,
    date: dateStr,
    note: targetQty ? `Отримано: ${targetQty}` : ''
  });

  saveInvestments();
  closeModal();
  showToast(`🎯 Переведено ${fmt(spendCost)} грн з ${src.name} в ${targetName}!`);
}

  }

  let proposedTx = [...transactions];
  if (fromMainWallet) {
    proposedTx.unshift({

      amount,
      category: 'Інвестиції',
      date: dateStr,
      status: 'confirmed',
      comment: `Купівля ${name}`
    });
  }

  const newHistoryItem = {
    id: 'ih_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    action: 'buy',
    assetName: name,
    assetType,
    amount,
    pnl: 0,
    date: dateStr,
    note
  };
  const proposedHistory = [newHistoryItem, ...investHistory];

  const sim = validateSimulatedState(proposedTx, investAssets, proposedHistory);
  if (sim.wallet < 0) {
    showToast(`❌ Недостатньо коштів в основному гаманці!`);
    return;
  }
  if (sim.investCash < 0) {

      amount,
      category: 'Інвестиції',
      date: dateStr,
      status: 'confirmed',
      comment: `Купівля ${name}`
    });

  const mergeIfExists = form['merge-existing'] ? form['merge-existing'].checked : false;
  const existingAsset = mergeIfExists ? investAssets.find(a => (a.assetType || 'tokens') === assetType && (a.name || '').trim().toLowerCase() === name.toLowerCase()) : null;

  if (existingAsset) {
    const oldQ = parseQtyNum(existingAsset.quantity);
    const addQ = parseQtyNum(quantity);
    const combinedQty = (!isNaN(oldQ) && !isNaN(addQ)) ? String(Math.round((oldQ + addQ) * 1000000) / 1000000) : (quantity || existingAsset.quantity);
    investAssets = investAssets.map(a => a.id === existingAsset.id ? {
      ...a,
      investedAmount: Math.round(((a.investedAmount || 0) + amount) * 100) / 100,

      date: dateStr,
      note: note ? (a.note ? a.note + '; ' + note : note) : a.note
    } : a);

      id: 'asset_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),

      currentValue: amount,

function submitSellAsset(e) {
  e.preventDefault();
  const form = e.target;
  const asset = modal.asset;
  const rawSell = form['sell-amount'].value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
  const sellAmount = parseFloat(rawSell);
  const isFull = form['sell-mode'].value === 'full';
  const dateStr = form['sell-date'].value || toLocalDateString(new Date());
  const withdrawToMain = form['withdraw-to-main'] ? form['withdraw-to-main'].checked : false;

  if (!sellAmount || sellAmount <= 0) { showToast('❌ Введіть суму продажу'); return; }

  let costBasisSold = asset.investedAmount;
  if (!isFull) {
    const rawRemainCost = form['remain-cost'].value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
    const remainCost = parseFloat(rawRemainCost);
    if (isNaN(remainCost) || remainCost < 0 || remainCost > asset.investedAmount) {
      showToast('❌ Вкажіть коректний залишок вкладення');
      return;
    }
    costBasisSold = Math.round((asset.investedAmount - remainCost) * 100) / 100;
    const newCurrent = Math.max(0, Math.round((asset.currentValue - sellAmount) * 100) / 100);
    const remainQty = form['remain-qty'] ? form['remain-qty'].value.trim() : asset.quantity;
    investAssets = investAssets.map(a => a.id === asset.id ? {
      ...a,
      investedAmount: remainCost,
      currentValue: newCurrent || remainCost,
      quantity: remainQty
    } : a);
  } else {
    investAssets = investAssets.filter(a => a.id !== asset.id);
  }

  const pnl = Math.round((sellAmount - costBasisSold) * 100) / 100;
  investHistory.unshift({
    id: 'ih_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    action: 'sell',
    assetName: asset.name,
    assetType: asset.assetType,
    amount: sellAmount,
    pnl: pnl,
    date: dateStr,
    note: isFull ? 'Повний продаж' : 'Частковий продаж'
  });
  saveInvestments();

  if (withdrawToMain) {
    transactions.unshift({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      type: 'invest_out',
      amount: sellAmount,
      category: 'Інвестиції',
      date: dateStr,
      status: 'confirmed',
      comment: `Продаж ${asset.name}`
    });
    saveData();
  }

  closeModal();
  const pnlTxt = pnl >= 0 ? `+${fmt(pnl)} грн прибутку` : `${fmt(pnl)} грн збитку`;
  showToast(withdrawToMain ? `💰 Продано (${pnlTxt}) та виведено в гаманець!` : `💰 Продано (${pnlTxt})! Кошти в інвест-кеші.`);
}

function openModal(type) {
  modal = { mode: 'create', type };
  render();
  setTimeout(() => {
    const input = document.getElementById('amount-input');
    if (input) input.focus();
  }, 100);
}

function openEditModal(txId) {
  const tx = transactions.find(t => t.id === txId); if (!tx) return;
  modal = { mode: 'edit', tx, type: tx.type };
  render();
  setTimeout(() => {
    const input = document.getElementById('amount-input');
    if (input) input.focus();
  }, 100);
}

function openConfirmModal(txId) {
  const tx = transactions.find(t => t.id === txId); if (!tx) return;
  modal = { mode: 'confirm', tx, type: tx.type };
  render();
  setTimeout(() => {
    const input = document.getElementById('amount-input');
    if (input) input.focus();
  }, 100);
}

function closeModal() { modal = null; render(); }

function selectCategory(btn, value) {
  document.querySelectorAll('#chip-grid .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const hidden = document.getElementById('category-hidden');
  const customBox = document.getElementById('custom-cat-box');
  const customInput = document.getElementById('custom-category-input');
  const iconBar = document.getElementById('cat-icon-edit-bar');
  const currentIconSpan = document.getElementById('current-cat-icon');
  
  if (value === '__custom__') {
    hidden.value = '__custom__'; 
    if (customBox) customBox.style.display = 'block'; 
    if (customInput) { customInput.required = true; customInput.focus(); }
    if (iconBar) iconBar.style.display = 'none';
  } else {
    hidden.value = value; 
    if (customBox) customBox.style.display = 'none'; 
    if (customInput) customInput.required = false;
    if (iconBar) iconBar.style.display = 'flex';
    if (currentIconSpan) currentIconSpan.textContent = iconFor(value);
  }
}

function attachModalListeners() {
  if (!modal) return;
  document.querySelectorAll('#chip-grid .chip-select').forEach((btn) => {
    btn.addEventListener('click', () => selectCategory(btn, btn.dataset.cat));
  });
  document.querySelectorAll('#chip-grid .chip-del').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); deleteCategory(modal.type, btn.dataset.cat); });
  });
  const customBtn = document.getElementById('chip-custom-btn');
  if (customBtn) customBtn.addEventListener('click', () => selectCategory(customBtn, '__custom__'));
}

function updatePartialHint(val, total) {
  const hint = document.getElementById('partial-hint');
  if (!hint) return;
  const num = parseFloat(String(val).replace(',', '.').replace(/[^0-9.]/g, '')) || 0;
  if (num > 0 && num < total) {
    const diff = Math.round((total - num) * 100) / 100;
    hint.style.display = 'block';
    hint.innerHTML = `ℹ️ <b>Часткове зарахування:</b> ${fmt(num)} грн піде у фактичні ${modal.tx && modal.tx.type === 'income' ? 'доходи' : 'витрати'}, а залишок <b>${fmt(diff)} грн</b> залишиться чекати в очікуваних ⏳`;
  } else if (num >= total) {
    hint.style.display = 'block';
    hint.innerHTML = `✅ Операцію буде повністю закрито на суму <b>${fmt(num)} грн</b>.`;
  } else {
    hint.style.display = 'none';
  }
}

function submitModal(e) {
  e.preventDefault();
  const form = e.target;
  const rawAmount = form.amount.value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
  const amount = parseFloat(rawAmount);
  let category = form.category ? form.category.value : (modal.tx ? modal.tx.category : '');
  
  if (category === '__custom__') category = form['custom-category'].value.trim();
  if (!amount || amount <= 0 || !category) { showToast('❌ Помилка: Введіть суму більше нуля'); return; }

  const dateStr = form['tx-date'] ? form['tx-date'].value : toLocalDateString(new Date());
  const isPending = form['is-pending'] ? form['is-pending'].checked : false;
  const comment = form['tx-comment'] ? form['tx-comment'].value.trim() : (modal.tx ? modal.tx.comment : '');
  
  const catLower = String(category || '').trim().toLowerCase();
  let isParking = Boolean(modal.isParking || (modal.tx ? modal.tx.isParking : false));
  let isParkingRefund = Boolean(modal.isParkingRefund || (modal.tx ? modal.tx.isParkingRefund : false));
  let isDebt = Boolean(modal.isDebt || (modal.tx ? modal.tx.isDebt : false));
  let isDebtRefund = Boolean(modal.isDebtRefund || (modal.tx ? modal.tx.isDebtRefund : false));

  if (form['is-parking-check']) {
    if (form['is-parking-check'].checked) {
      if (catLower === 'борг' || catLower === 'борги' || (modal.mode === 'create' && activeReimbTab === 'debt' && catLower !== 'парковка' && catLower !== 'паркінг')) {
        isDebt = true;
        isParking = false;
      } else {
        isParking = true;
        isDebt = false;
      }
    } else {
      isParking = false;
      isDebt = false;
    }
  }

  if (modal.type === 'income') {
    if (catLower === 'повернення боргу' || catLower === 'повернули борг') {
      isDebtRefund = true;
      isParkingRefund = false;
    } else if (catLower === 'повернення парковки' || catLower === 'повернення за парковку') {
      isParkingRefund = true;
      isDebtRefund = false;
    }
  }

  const targetStatus = isPending ? 'pending' : 'confirmed';
  const newFields = { amount, category, date: dateStr, status: targetStatus, comment, isParking, isParkingRefund, isDebt, isDebtRefund };

  const isConfirm = modal.mode === 'confirm';
  let isPartialConfirm = false;
  let remainingAmount = 0;

  if (isConfirm && modal.tx) {
    const origAmount = modal.tx.amount;
    if (amount < origAmount) {
      isPartialConfirm = true;
      remainingAmount = Math.round((origAmount - amount) * 100) / 100;
    }
  }

  let proposedTx = [...transactions];
  if (modal.mode === 'create') {
    proposedTx.unshift({ id: 'temp_check', type: modal.type, ...newFields });
  } else if (modal.mode === 'edit') {
    proposedTx = proposedTx.map(t => t.id === modal.tx.id ? { ...t, ...newFields } : t);
  } else if (isConfirm) {
    if (isPartialConfirm) {
      proposedTx = proposedTx.map(t => t.id === modal.tx.id ? { ...t, amount: remainingAmount } : t);
      proposedTx.unshift({
        id: 'temp_confirmed',
        type: modal.tx.type,
        amount: amount,
        category: category,
        date: dateStr,
        status: 'confirmed',
        comment: comment,
        isParking: isParking,
        isParkingRefund: isParkingRefund,
        isDebt: isDebt,
        isDebtRefund: isDebtRefund
      });
    } else {
      proposedTx = proposedTx.map(t => t.id === modal.tx.id ? { ...t, ...newFields, status: 'confirmed' } : t);
    }
  }

  const sim = validateSimulatedState(proposedTx);
  if (sim.savings < 0) { showToast(`❌ Відхилено: Скарбничка піде в мінус (${fmt(sim.savings)} грн)`); return; }
  if (sim.wallet < 0) { showToast(`❌ Відхилено: Гаманець піде в мінус (${fmt(sim.wallet)} грн)`); return; }
  if (sim.investCash < 0) { showToast(`❌ Відхилено: Вільний кеш інвестицій піде в мінус (${fmt(sim.investCash)} грн)`); return; }

  const currentCats = customCategories[modal.type] || [];
  if (!currentCats.some(c => c.toLowerCase() === category.toLowerCase())) {
    customCategories[modal.type] = [...currentCats, category]; saveCategories();
    if (form['custom-cat-icon']) {
      categoryIcons[category] = form['custom-cat-icon'].value || '📌';
      saveCategoryIcons();
    }
  } else {
    category = currentCats.find(c => c.toLowerCase() === category.toLowerCase()) || category;
  }

  if (modal.mode === 'create') {
    const autoIsJob = modal.type === 'income' && (isPending || isJobCategory(category));
    addTransaction({
      type: modal.type,
      ...newFields,
      plannedDate: isPending ? dateStr : null,
      createdAt: dateStr,
      confirmedAt: isPending ? null : dateStr,
      initialAmount: amount,
      isJob: autoIsJob
    });
    showToast(
      isPending ? '⏳ Заплановану операцію збережено!' :
      (isParking ? '🅿️ Витрату на парковку додано в облік!' :
      (isParkingRefund ? '↩️ Повернення за парковку зараховано!' :
      (isDebt ? '💸 Витрату в борг додано в облік!' :
      (isDebtRefund ? '↩️ Повернення боргу зараховано!' : '✅ Операцію успішно додано!'))))
    );
  } else if (modal.mode === 'edit') {
    const keepCreated = modal.tx.createdAt || modal.tx.plannedDate || dateStr;
    updateTransaction(modal.tx.id, {
      ...newFields,
      createdAt: keepCreated,
      initialAmount: (!modal.tx.parentPendingId && modal.tx.status === 'pending' && !transactions.some(c => c.parentPendingId === modal.tx.id)) ? amount : (modal.tx.initialAmount || amount)
    });
    showToast('✅ Зміни успішно збережено!');
  } else if (isConfirm) {
    const lockedCreated = modal.tx.createdAt || modal.tx.plannedDate || modal.tx.date;
    const prevChildrenSum = transactions
      .filter(c => c.parentPendingId === modal.tx.id && c.status !== 'pending')
      .reduce((s, c) => s + (c.amount || 0), 0);
    const lockedInitial = modal.tx.initialAmount || Math.round((prevChildrenSum + modal.tx.amount) * 100) / 100;

    if (isPartialConfirm) {
      updateTransaction(modal.tx.id, {
        amount: remainingAmount,
        initialAmount: lockedInitial,
        createdAt: lockedCreated,
        plannedDate: lockedCreated,
        category: category,
        isJob: modal.tx.isJob || modal.tx.type === 'income',
        comment: modal.tx.comment || comment || ''
      });
      const baseNote = comment || modal.tx.comment || '';
      const partLabel = baseNote ? (baseNote.includes('(частина)') ? baseNote : `${baseNote} (частина)`) : `Частина (від ${lockedCreated})`;
      addTransaction({
        type: modal.tx.type,
        amount: amount,
        category: category,
        date: dateStr,
        createdAt: lockedCreated,
        status: 'confirmed',
        confirmedAt: dateStr,
        comment: partLabel,
        isParking: isParking,
        isParkingRefund: isParkingRefund,
        isDebt: isDebt,
        isDebtRefund: isDebtRefund,
        parentPendingId: modal.tx.id
      });
      showToast(`✅ Зараховано ${fmt(amount)} грн! Залишок ${fmt(remainingAmount)} грн чекає в очікуваних ⏳`);
    } else {
      updateTransaction(modal.tx.id, {
        ...newFields,
        date: dateStr,
        createdAt: lockedCreated,
        plannedDate: lockedCreated,
        initialAmount: Math.max(lockedInitial, Math.round((prevChildrenSum + amount) * 100) / 100),
        isJob: modal.tx.isJob || modal.tx.type === 'income',
        jobLocation: modal.tx.jobLocation || '',
        jobDesc: modal.tx.jobDesc || '',
        comment: modal.tx.comment || comment || '',
        status: 'confirmed',
        confirmedAt: dateStr
      });
      showToast('✅ Операцію успішно підтверджено повністю!');
    }
  }
  closeModal();
}

function renderInvestTab(simState) {
  const investCash = simState.investCash;
  const totalInvestedCost = investAssets.reduce((s, a) => s + (a.investedAmount || 0), 0);
  const totalAssetsVal = investAssets.reduce((s, a) => s + (a.currentValue ?? a.investedAmount ?? 0), 0);
  const totalPortfolio = investCash + totalAssetsVal;
  const unrealizedPnl = totalAssetsVal - totalInvestedCost;
  const unrealizedPct = totalInvestedCost > 0 ? Math.round((unrealizedPnl / totalInvestedCost) * 1000) / 10 : 0;
  const realizedPnl = investHistory.filter(h => h.action === 'sell').reduce((s, h) => s + (h.pnl || 0), 0);

  const pnlClass = unrealizedPnl > 0 ? 'pos' : (unrealizedPnl < 0 ? 'neg' : 'flat');
  const pnlSign = unrealizedPnl > 0 ? '+' : '';

  const byType = {};
  investAssets.forEach(a => {
    const t = a.assetType || 'tokens';
    byType[t] = (byType[t] || 0) + (a.currentValue ?? a.investedAmount ?? 0);
  });

  let html = `
    <div class="invest-hero">
      <div class="summary-label">Всього в інвестиціях</div>
      <div class="invest-total">${fmt(totalPortfolio)} грн</div>
      <div class="invest-pnl-badge ${pnlClass}">
        ${pnlSign}${fmt(unrealizedPnl)} грн (${pnlSign}${unrealizedPct}%) за відкритими активами
      </div>
      <div class="split-row">
        <div class="split-col">
          <div class="summary-label">Вільний кеш</div>
          <div class="split-value" style="color:var(--save)">${fmt(investCash)} грн</div>
        </div>
        <div class="split-col">
          <div class="summary-label">В активах</div>
          <div class="split-value" style="color:var(--accent)">${fmt(totalAssetsVal)} грн</div>
        </div>
      </div>
      ${realizedPnl !== 0 ? `
        <div class="divider"></div>
        <div class="saved-row">
          <div class="summary-label" style="margin-bottom:0">Зафіксовано прибутку з продажів</div>
          <div class="saved-value" style="color:${realizedPnl >= 0 ? 'var(--income)' : 'var(--expense)'}">${realizedPnl >= 0 ? '+' : ''}${fmt(realizedPnl)} грн</div>
        </div>
      ` : ''}
    </div>

    <div class="invest-actions-row">
      <button class="action-btn" onclick="openInvestTransferModal('invest_in')">
        <div class="action-icon plus">↗</div>
        <div>
          <div class="action-title">Поповнити</div>
          <div style="font-size:11px; color:var(--text-secondary)">з основного гаманця</div>
        </div>
      </button>
      <button class="action-btn" onclick="openInvestTransferModal('invest_out')">
        <div class="action-icon take">↙</div>
        <div>
          <div class="action-title">Повернути</div>
          <div style="font-size:11px; color:var(--text-secondary)">в основний гаманець</div>
        </div>
      </button>
    </div>

    <button class="invest-buy-btn" onclick="openBuyAssetModal()">
      <span>+ Купити актив (Токени, Акції, ОВДП...)</span>
    </button>

    <section class="list-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="section-title" style="margin:0;">Мій портфель</h2>
        ${getDuplicateAssetGroups().length ? `<button class="backup-btn" style="flex:0; padding:6px 10px; font-size:12px; color:var(--accent); border-color:var(--accent);" onclick="mergeDuplicateAssets()">🔗 Обʼєднати однакові</button>` : ''}
      </div>
  `;

  if (investAssets.length === 0) {
    html += `<div class="empty-state">Поки що немає активів. Поповніть рахунок з основної вкладки або натисніть «+ Купити актив».</div>`;
  } else {

      const tInfo = investTypeInfo(a.assetType);
      const cur = a.currentValue ?? a.investedAmount ?? 0;
      const cost = a.investedAmount || 0;
      const diff = cur - cost;
      const pct = cost > 0 ? Math.round((diff / cost) * 1000) / 10 : 0;
      const pCls = diff > 0 ? 'pos' : (diff < 0 ? 'neg' : 'flat');
      const pSign = diff > 0 ? '+' : '';
      return `
        <div class="asset-card">
          <div class="asset-top">
            <div>
              <div class="asset-name">${tInfo.icon} ${escapeHtml(a.name)} ${a.quantity ? `<span style="font-size:13px; color:var(--accent); font-weight:600">(${escapeHtml(a.quantity)})</span>` : ''}</div>
              <div class="asset-sub">${escapeHtml(tInfo.label)} ${a.isAllocPending ? '• <span style="color:var(--accent)">⏳ Заявка подана</span>' : ''} • Вкладено: ${fmt(cost)} грн • ${escapeHtml(a.date)}</div>
              ${a.note ? `<div class="asset-sub" style="color:var(--text-tertiary)">${escapeHtml(a.note)}</div>` : ''}
            </div>
            <div>
              <div class="asset-val">${fmt(cur)} грн</div>
              <div class="asset-pnl ${pCls}">${pSign}${fmt(diff)} грн (${pSign}${pct}%)</div>

            <button class="asset-btn sell" onclick="openSellAssetModal('${a.id}')">💰 Продати</button>
            <button class="asset-btn del" onclick="openDeleteAssetModal('${a.id}')" title="Видалити">🗑️</button>
          </div>
        </div>
      `;
    }).join('');
  }

  html += `</section>`;

  if (Object.keys(byType).length > 0) {
    html += `<section class="list-section"><h2 class="section-title">Розподіл за типами</h2>`;
    html += Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([tId, val]) => {
      const tInfo = investTypeInfo(tId);
      const pct = totalAssetsVal > 0 ? Math.round((val / totalAssetsVal) * 100) : 0;
      return `
        <div class="list-item">
          <div class="list-item-top">
            <div class="list-item-name">${tInfo.icon} ${escapeHtml(tInfo.label)}</div>
            <div class="list-item-amount" style="color:var(--accent)">${fmt(val)} грн</div>
          </div>
          <div class="pct-label">${pct}% від портфеля</div>
          <div class="bar-track"><div class="bar-fill" style="background:var(--accent); width:${pct}%"></div></div>

    }).join('');
    html += `</section>`;
  }

  html += `
    <section class="list-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="section-title" style="margin:0;">Історія угод</h2>
        <button class="backup-btn" style="flex:0; padding:6px 12px;" onclick="toggleInvestHistory()">${showInvestHistory ? 'Сховати' : 'Показати'}</button>
      </div>
  `;
  if (showInvestHistory) {
    html += `<div class="list-item scroll-area">`;
    if (investHistory.length === 0) {
      html += `<div class="empty-state">Історія угод порожня</div>`;
    } else {
      html += investHistory.map(h => {
        const tInfo = investTypeInfo(h.assetType);
        const isBuy = h.action === 'buy';
        const isSwap = h.action === 'swap';
        const actionLabel = isSwap ? 'Обмін' : (isBuy ? 'Купівля' : 'Продаж');
        const amtCls = isSwap ? 'pending' : (isBuy ? 'expense' : 'income');
        const amtSign = isSwap ? '🔄 ' : (isBuy ? '−' : '+');
        const pnlBadge = !isBuy && !isSwap && h.pnl !== 0 ? ` <span style="font-size:11.5px; color:${h.pnl >= 0 ? 'var(--income)' : 'var(--expense)'}">(${h.pnl >= 0 ? '+' : ''}${fmt(h.pnl)} грн)</span>` : '';
        return `
          <div class="tx-row" style="cursor:default;">
            <div class="tx-meta">
              <div class="tx-cat">${tInfo.icon} ${actionLabel}: ${escapeHtml(h.assetName)}${pnlBadge}</div>
              <div class="tx-date">${escapeHtml(h.date)} ${h.note ? `• ${escapeHtml(h.note)}` : ''}</div>
            </div>
            <div class="tx-right">
              <div class="list-item-amount ${amtCls}">${amtSign}${fmt(h.amount)} грн</div>
            </div>
          </div>
        `;
      }).join('');
    }
    html += `</div>`;
  }
  html += `</section>`;

  html += `
    <div class="backup-row" style="margin-top:8px;">
      <button class="backup-btn" onclick="setupInvestStartingBalance()">💰 Початковий баланс інвестицій: ${fmt(investStartingBalance)} грн</button>

  return html;
