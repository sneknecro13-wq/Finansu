<!DOCTYPE html>
<html lang="uk">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фінанси</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фінанси">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161c;
    --bg-elevated: #1c1f28;
    --bg-elevated-2: #232733;
    --stroke: #2b2f3b;
    --text-primary: #f2f3f5;
    --text-secondary: #8b90a0;
    --text-tertiary: #5c6070;
    --accent: #d4a24c;
    --accent-dim: #d4a24c22;
    --income: #4ade8a;
    --income-dim: #4ade8a1a;
    --expense: #f2685c;
    --expense-dim: #f2685c1a;
    --save: #5b9bd9;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 100px;
    min-height: 100vh;
  }
  .eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .eyebrow .bag { font-size: 26px; }
  h1 { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-md); padding: 14px 8px; margin-bottom: 16px;
  }
  .month-nav button {
    background: none; border: none; color: var(--text-secondary);
    font-size: 20px; width: 40px; height: 40px; cursor: pointer;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:active { background: var(--bg-elevated-2); }
  .month-label { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 17px; }
  .summary-card {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-lg); padding: 26px 22px; margin-bottom: 16px;
  }
  .summary-row { margin-bottom: 18px; }
  .summary-label { color: var(--text-secondary); font-size: 14px; margin-bottom: 4px; }
  .summary-net { font-size: 17px; font-weight: 600; }
  .summary-available {
    font-family: 'Sora', sans-serif; font-size: 40px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1.1;
  }
  .summary-projected {
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 8px;
    background: var(--bg-elevated-2);
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-block;
    border: 1px solid var(--stroke);
  }
  .summary-projected b { color: var(--text-primary); font-family: 'Sora', sans-serif; }
  .split-row { display: flex; gap: 20px; margin-top: 18px; }
  .split-col { flex: 1; }
  .split-value { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; }
  .split-value.income { color: var(--income); }
  .split-value.expense { color: var(--expense); }
  .divider { height: 1px; background: var(--stroke); margin: 18px 0; }
  .saved-row { display: flex; justify-content: space-between; align-items: center; }
  .saved-value { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; color: var(--save); }
  
  /* Зменшені компактні кнопки по центру */
  .action-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;
  }
  .action-btn {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-md); padding: 12px 14px; display: flex;
    align-items: center; gap: 12px; cursor: pointer; text-align: left;
    color: var(--text-primary); font-family: 'IBM Plex Sans', sans-serif;
  }
  .action-btn:active { background: var(--bg-elevated-2); }
  .action-icon {
    width: 32px; height: 32px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
    flex-shrink: 0;
  }
  .action-icon.plus { background: var(--income-dim); color: var(--income); }
  .action-icon.minus { background: var(--expense-dim); color: var(--expense); }
  .action-icon.save { background: rgba(91, 155, 217, 0.18); color: var(--save); }
  .action-icon.take { background: var(--accent-dim); color: var(--accent); }
  .action-title { font-weight: 600; font-size: 14px; }

  section.list-section { margin-bottom: 28px; }
  .section-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 12px 2px; }
  
  .list-item {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 16px; margin-bottom: 8px;
  }
  
  .scroll-area {
    max-height: 55vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px 16px !important;
  }
  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }

  .list-item-top { display: flex; justify-content: space-between; align-items: center; }
  .list-item-name { font-weight: 500; font-size: 15px; }
  .list-item-amount { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; }
  .list-item-amount.income { color: var(--income); }
  .list-item-amount.expense { color: var(--expense); }
  .list-item-amount.pending { color: var(--accent); }
  .pct-label { color: var(--text-tertiary); font-size: 12.5px; margin: 4px 0 8px; }
  .bar-track { height: 6px; background: var(--bg-elevated-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
  .bar-fill.expense { background: var(--expense); }
  .bar-fill.income { background: var(--income); }

  .empty-state { color: var(--text-tertiary); font-size: 14px; padding: 20px 4px; text-align: center; }
  .tx-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--stroke); cursor: pointer;
  }
  .tx-row:last-child { border-bottom: none; }
  .tx-meta { display: flex; flex-direction: column; gap: 2px; }
  .tx-cat { font-size: 14.5px; font-weight: 500; }
  .tx-date { font-size: 12px; color: var(--text-tertiary); }
  .tx-right { display: flex; align-items: center; gap: 8px; }
  .tx-btn {
    background: none; border: none; color: var(--text-tertiary);
    font-size: 16px; cursor: pointer; padding: 6px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .tx-btn:hover, .tx-btn:active { color: var(--text-primary); background: var(--bg-elevated-2); }
  .tx-btn.confirm-btn { color: var(--accent); }
  .tx-btn.confirm-btn:hover { color: var(--income); }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,11,14,0.75);
    display: flex; align-items: flex-start; justify-content: center; 
    z-index: 50; backdrop-filter: blur(2px); padding: 8vh 16px 16px;
    overflow-y: auto;
  }
  .sheet {
    background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-lg); width: 100%; max-width: 440px;
    padding: 24px 20px;
    animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn { 
    from { transform: scale(0.95) translateY(-10px); opacity: 0; } 
    to { transform: scale(1) translateY(0); opacity: 1; } 
  }
  .sheet-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 19px; margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 13px 14px; color: var(--text-primary);
    font-size: 16px; font-family: 'IBM Plex Sans', sans-serif;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field-checkbox {
    display: flex; align-items: center; gap: 10px; background: var(--bg-elevated-2);
    padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--stroke);
    cursor: pointer; user-select: none;
  }
  .field-checkbox input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
  .field-checkbox span { font-size: 14px; font-weight: 500; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 14px; border-radius: var(--radius-sm);
    border: none; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .btn-cancel { background: var(--bg-elevated-2); color: var(--text-secondary); }
  .btn-confirm { color: #14161c; }
  .btn-confirm.income { background: var(--income); }
  .btn-confirm.expense { background: var(--expense); }
  .btn-confirm.save { background: var(--save); }
  .btn-confirm.take { background: var(--accent); }
  .btn-confirm.edit { background: var(--accent); color: #14161c; }
  .btn-danger { background: var(--expense-dim); color: var(--expense); }
  .loading-msg { text-align: center; color: var(--text-tertiary); padding: 60px 20px; font-size: 14px; }
  .backup-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .backup-btn {
    flex: 1; background: var(--bg-elevated); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 12px; color: var(--text-secondary);
    font-size: 13px; font-weight: 500; cursor: pointer; text-align: center;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .backup-btn:active { background: var(--bg-elevated-2); }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--bg-elevated-2); border: 1px solid var(--stroke);
    border-radius: 999px; padding: 9px 14px; font-size: 14px;
    color: var(--text-secondary); cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    transition: all 0.15s ease;
  }
  .chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip-wrap { position: relative; display: inline-block; }
  .chip-wrap .chip { padding-right: 30px; }
  .chip-del {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 20px; height: 20px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.08); color: var(--text-tertiary);
    font-size: 13px; line-height: 1; cursor: pointer; display: flex;
    align-items: center; justify-content: center; padding: 0;
  }
  .chip-del:active { background: var(--expense-dim); color: var(--expense); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elevated-2); border: 1px solid var(--stroke);
    color: var(--text-primary); padding: 12px 20px; border-radius: 12px;
    font-size: 14px; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: fadeUp 0.2s ease-out;
    white-space: nowrap;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* Віджет контролю парковки та компенсацій */
  .parking-card {
    background: linear-gradient(145deg, #1b212d 0%, #161922 100%);
    border: 1px solid #364157;
    border-radius: var(--radius-lg);
    padding: 18px 18px 16px;
    margin-bottom: 22px;
  }
  .parking-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }
  .parking-title {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .parking-status {
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  }
  .parking-status.debt { background: rgba(242, 104, 92, 0.2); color: var(--expense); border: 1px solid var(--expense); }
  .parking-status.clear { background: rgba(74, 222, 138, 0.18); color: var(--income); border: 1px solid var(--income); }
  
  .parking-numbers {
    display: flex; gap: 10px; margin: 12px 0; background: var(--bg-elevated);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .parking-col { flex: 1; }
  .parking-label { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 2px; }
  .parking-val { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; }
  .parking-val.owe { color: var(--accent); }
  .parking-val.paid { color: var(--expense); }
  .parking-val.back { color: var(--income); }

  .parking-btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .p-btn {
    flex: 1; padding: 10px 8px; border-radius: var(--radius-sm); border: none;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    font-family: 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .p-btn.pay { background: var(--expense-dim); color: var(--expense); border: 1px solid rgba(242, 104, 92, 0.3); }
  .p-btn.refund { background: var(--income-dim); color: var(--income); border: 1px solid rgba(74, 222, 138, 0.3); }
  .p-btn.log { background: var(--bg-elevated-2); color: var(--text-secondary); border: 1px solid var(--stroke); flex: 0.8; }
  .p-btn:active { opacity: 0.85; }

  .parking-history {
    margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--stroke);
    max-height: 220px; overflow-y: auto;
  }
  .p-hist-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .p-hist-item:last-child { border-bottom: none; }
  .p-hist-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .p-hist-tag.pay { background: var(--expense-dim); color: var(--expense); }
  .p-hist-tag.refund { background: var(--income-dim); color: var(--income); }

</style>
</head>
<body>
<div id="app"><div class="loading-msg">Завантаження…</div></div>

<script>
window.onerror = function(msg, url, line, col, error) {
  var app = document.getElementById('app');
  if (app) {
    app.innerHTML = '<div style="padding:40px 20px; color:#f2685c; font-family:sans-serif; text-align:center;">' +
      '<div style="font-size:36px; margin-bottom:12px;">⚠️</div>' +
      '<div style="font-size:17px; font-weight:700; color:#f2f3f5; margin-bottom:8px;">Помилка запуску скрипта</div>' +
      '<div style="font-size:13px; color:#8b90a0; margin-bottom:20px; word-break:break-word;">' + (msg || error) + ' (рядок ' + line + ')</div>' +
      '<button onclick="localStorage.clear(); location.reload();" style="background:#232733; color:#f2f3f5; border:1px solid #2b2f3b; padding:12px 18px; border-radius:12px; font-size:14px; cursor:pointer;">Скинути памʼять і перезавантажити</button>' +
    '</div>';
  }
  return false;
};

const MONTHS_UK = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const STORAGE_KEY = 'finance-transactions-v1';
const CATS_KEY = 'finance-custom-categories-v1';
const BACKUP_URL_KEY = 'finance-backup-url-v1';
const TG_KEY = 'finance-telegram-v1';
const STARTING_BALANCE_KEY = 'finance-starting-balance-v1';

const DEFAULT_CATS = {
  income: ['Зарплата', 'Бізнес', 'Фріланс', 'Повернення парковки', 'Інші доходи'],
  expense: ['Квартира', 'Їжа', 'Транспорт', 'Парковка', 'Комунальні', 'Розваги', 'Здоровʼя', 'Інше'],
  save: ['Заощадження'],
  take: ['Заощадження']
};

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let transactions = [];
let customCategories = { income: [], expense: [], save: [], take: [] };
let startingBalance = 0;
let monthOffset = 0;
let modal = null;
let loaded = false;
let toast = null;
let toastTimer = null;
let backupUrl = null;
let syncTimer = null;
let tgSyncTimer = null;
let telegramConfig = null;
let showParkingHistory = false;

function showToast(msg) {
  toast = msg;
  render();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast = null;
    render();
  }, 3000);
}

function fmt(n) {
  return Math.round(n || 0).toLocaleString('uk-UA');
}

function currentMonthDate() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth() + monthOffset, 1);
}

function monthKey(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
}

function toLocalDateString(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

async function loadData() {
  try {
    if (window.storage) {
      const res = await window.storage.get(STORAGE_KEY, false);
      transactions = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      transactions = raw ? JSON.parse(raw) : [];
    }
  } catch (e) { transactions = []; }

  try {
    if (window.storage) {
      const res = await window.storage.get(STARTING_BALANCE_KEY, false);
      startingBalance = res ? parseFloat(res.value) || 0 : 0;
    } else {
      startingBalance = parseFloat(localStorage.getItem(STARTING_BALANCE_KEY)) || 0;
    }
  } catch (e) { startingBalance = 0; }

  try {
    if (window.storage) {
      const res = await window.storage.get(CATS_KEY, false);
      customCategories = res ? JSON.parse(res.value) : { income: [], expense: [], save: [], take: [] };
    } else {
      const raw = localStorage.getItem(CATS_KEY);
      customCategories = raw ? JSON.parse(raw) : { income: [], expense: [], save: [], take: [] };
    }
  } catch (e) { customCategories = { income: [], expense: [], save: [], take: [] }; }

  let seeded = false;
  Object.keys(DEFAULT_CATS).forEach((type) => {
    const existing = customCategories[type] || [];
    if (!Array.isArray(customCategories[type])) seeded = true;
    const merged = DEFAULT_CATS[type].concat(existing.filter((c) => !DEFAULT_CATS[type].includes(c)));
    if (merged.length !== existing.length || !Array.isArray(customCategories[type])) seeded = true;
    customCategories[type] = merged;
  });
  if (seeded) saveCategories();
  loaded = true;
  render();
}

async function saveData() {
  try {
    if (window.storage) await window.storage.set(STORAGE_KEY, JSON.stringify(transactions), false);
    else localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  } catch (e) { console.error(e); }
  scheduleCloudSync();
  scheduleTelegramSync();
}

async function saveStartingBalance(val) {
  startingBalance = val;
  try {
    if (window.storage) await window.storage.set(STARTING_BALANCE_KEY, String(val), false);
    else localStorage.setItem(STARTING_BALANCE_KEY, String(val));
  } catch (e) { console.error(e); }
  scheduleCloudSync();
  scheduleTelegramSync();
}

async function saveCategories() {
  try {
    if (window.storage) await window.storage.set(CATS_KEY, JSON.stringify(customCategories), false);
    else localStorage.setItem(CATS_KEY, JSON.stringify(customCategories));
  } catch (e) { console.error(e); }
  scheduleCloudSync();
  scheduleTelegramSync();
}

async function loadBackupUrl() {
  try {
    if (window.storage) { const res = await window.storage.get(BACKUP_URL_KEY, false); backupUrl = res ? res.value : null; }
    else backupUrl = localStorage.getItem(BACKUP_URL_KEY) || null;
  } catch (e) { backupUrl = null; }
  if (loaded) render();
}

async function saveBackupUrl(url) {
  backupUrl = url || null;
  try {
    if (window.storage) {
      if (backupUrl) await window.storage.set(BACKUP_URL_KEY, backupUrl, false);
      else await window.storage.set(BACKUP_URL_KEY, "", false);
    } else {
      if (backupUrl) localStorage.setItem(BACKUP_URL_KEY, backupUrl);
      else localStorage.removeItem(BACKUP_URL_KEY);
    }
  } catch (e) { console.error(e); }
}


function scheduleTelegramSync() {
  if (telegramConfig && telegramConfig.token && telegramConfig.chatId) {
    clearTimeout(tgSyncTimer);
    tgSyncTimer = setTimeout(telegramSyncNow, 2000);
  }
}

function scheduleCloudSync() {
  if (backupUrl) { clearTimeout(syncTimer); syncTimer = setTimeout(cloudSyncNow, 2500); }
}

async function cloudSyncNow() {
  if (!backupUrl) return;
  try {
    await fetch(backupUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transactions, customCategories, startingBalance, savedAt: new Date().toISOString() })
    });
  } catch (e) { console.error(e); }
}

async function restoreFromCloud() {
  if (!backupUrl) { showToast('❌ Спочатку налаштуй підключення до хмари'); return; }
  try {
    const res = await fetch(backupUrl);
    const parsed = await res.json();
    if (typeof parsed.startingBalance === 'number') saveStartingBalance(parsed.startingBalance);
    transactions = parsed.transactions || [];
    if (parsed.customCategories) customCategories = parsed.customCategories;
    saveData(); saveCategories(); render();
    showToast('✅ Дані повністю відновлено з хмари!');
  } catch (e) { showToast('❌ Не вдалося завантажити дані з хмари'); }

async function loadTelegramConfig() {

    else telegramConfig = JSON.parse(localStorage.getItem(TG_KEY) || 'null');
  } catch (e) { telegramConfig = null; }

}

async function saveTelegramConfig(cfg) {
  telegramConfig = cfg;
  try {
    if (window.storage) await window.storage.set(TG_KEY, JSON.stringify(cfg), false);
    else { if (cfg) localStorage.setItem(TG_KEY, JSON.stringify(cfg)); else localStorage.removeItem(TG_KEY); }
  } catch (e) { console.error(e); }
}

async function telegramSyncNow() {
  if (!telegramConfig || !telegramConfig.token || !telegramConfig.chatId) return;
  try {
    const payload = JSON.stringify({ transactions, customCategories, startingBalance, savedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const form = new FormData();
    form.append('chat_id', telegramConfig.chatId);
    form.append('document', blob, 'finance-backup.json');
    const res = await fetch(`https://api.telegram.org/bot${telegramConfig.token}/sendDocument`, { method: 'POST', body: form });
    const data = await res.json();
    if (data?.result?.message_id) {
      const prevMessageId = telegramConfig.lastMessageId;
      telegramConfig.lastMessageId = data.result.message_id;
      await saveTelegramConfig(telegramConfig);
      if (prevMessageId) {
        const delForm = new FormData();
        delForm.append('chat_id', telegramConfig.chatId);
        delForm.append('message_id', prevMessageId);
        fetch(`https://api.telegram.org/bot${telegramConfig.token}/deleteMessage`, {
          method: 'POST',
          body: delForm
        }).catch(() => {});
      }
    }
  } catch (e) { console.error(e); }
}

function setupStartingBalance() {
  const current = startingBalance || 0;
  const input = prompt('Введіть ваш початковий баланс (стартовий капітал), грн:', current);
  if (input === null) return;
  const parsedAmount = Math.max(0, parseFloat(input.trim().replace(',', '.').replace(/[^0-9.]/g, '')) || 0);
  
  const confirmed = transactions.filter(t => t.status !== 'pending');
  const inc = confirmed.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const exp = confirmed.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const sav = confirmed.filter(t => t.type === 'save').reduce((s, t) => s + t.amount, 0);
  const tak = confirmed.filter(t => t.type === 'take').reduce((s, t) => s + t.amount, 0);
  
  const newWallet = parsedAmount + inc - exp - sav + tak;
  if (newWallet < 0) {
    showToast(`❌ Помилка: з таким капіталом гаманець стане ${fmt(newWallet)} грн`);
    return;
  }

  saveStartingBalance(parsedAmount);
  render();
  showToast('✅ Стартовий капітал успішно оновлено!');
}

function validateSimulatedState(proposedTx) {
  const confirmed = proposedTx.filter(t => t.status !== 'pending');
  const inc = confirmed.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const exp = confirmed.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const sav = confirmed.filter(t => t.type === 'save').reduce((s, t) => s + t.amount, 0);
  const tak = confirmed.filter(t => t.type === 'take').reduce((s, t) => s + t.amount, 0);
  return {
    savings: sav - tak,
    wallet: startingBalance + inc - exp - sav + tak
  };
}

function addTransaction(tx) {
  transactions.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), ...tx });
  saveData(); render();
}

function updateTransaction(id, updatedFields) {
  transactions = transactions.map(t => t.id === id ? { ...t, ...updatedFields } : t);
  saveData(); render();
}

function deleteTransaction(id) {
  let proposedTx = transactions.filter(t => t.id !== id);
  const sim = validateSimulatedState(proposedTx);
  if (sim.savings < 0) {
    showToast(`❌ Неможливо видалити: скарбничка піде в мінус (${fmt(sim.savings)} грн)`);
    return false;
  }
  if (sim.wallet < 0) {
    showToast(`❌ Неможливо видалити: гаманець піде в мінус (${fmt(sim.wallet)} грн)`);
    return false;
  }
  transactions = proposedTx;
  saveData(); render(); showToast('🗑️ Запис успішно видалено!');
  return true;
}

function txForMonth(key) { return transactions.filter(t => t.date.slice(0, 7) === key); }

function groupSum(list) {
  const map = {}; list.forEach(t => { map[t.category] = (map[t.category] || 0) + t.amount; });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function updatePartialHint(val, total) {
  const hint = document.getElementById('partial-hint');
  if (!hint) return;
  const num = parseFloat(String(val).replace(',', '.').replace(/[^0-9.]/g, '')) || 0;
  if (num > 0 && num < total) {
    const diff = Math.round((total - num) * 100) / 100;
    hint.style.display = 'block';
    hint.innerHTML = `ℹ️ <b>Часткове зарахування:</b> ${fmt(num)} грн піде у фактичні ${modal.tx && modal.tx.type === 'income' ? 'доходи' : 'витрати'}, а залишок <b>${fmt(diff)} грн</b> залишиться чекати в очікуваних ⏳`;
  } else if (num >= total) {
    hint.style.display = 'block';
    hint.innerHTML = `✅ Операцію буде повністю закрито на суму <b>${fmt(num)} грн</b>.`;
  } else {
    hint.style.display = 'none';
  }
}

function submitModal(e) {
  e.preventDefault();
  const form = e.target;
  const rawAmount = form.amount.value.trim().replace(',', '.').replace(/[^0-9.]/g, '');
  const amount = parseFloat(rawAmount);
  let category = form.category ? form.category.value : (modal.tx ? modal.tx.category : '');
  
  if (category === '__custom__') category = form['custom-category'].value.trim();
  if (!amount || amount <= 0 || !category) { showToast('❌ Помилка: Введіть суму більше нуля'); return; }

  const dateStr = form['tx-date'] ? form['tx-date'].value : toLocalDateString(new Date());
  const isPending = form['is-pending'] ? form['is-pending'].checked : false;
  const comment = form['tx-comment'] ? form['tx-comment'].value.trim() : (modal.tx ? modal.tx.comment : '');
  
  let isParking = modal.isParking || (modal.tx ? modal.tx.isParking : false);
  let isParkingRefund = modal.isParkingRefund || (modal.tx ? modal.tx.isParkingRefund : false);
  if (form['is-parking-check']) isParking = form['is-parking-check'].checked;

  const targetStatus = isPending ? 'pending' : 'confirmed';
  const newFields = { amount, category, date: dateStr, status: targetStatus, comment, isParking, isParkingRefund };

  const isConfirm = modal.mode === 'confirm';
  let isPartialConfirm = false;
  let remainingAmount = 0;

  if (isConfirm && modal.tx) {
    const origAmount = modal.tx.amount;
    if (amount < origAmount) {
      isPartialConfirm = true;
      remainingAmount = Math.round((origAmount - amount) * 100) / 100;
    }
  }

  let proposedTx = [...transactions];
  if (modal.mode === 'create') {
    proposedTx.unshift({ id: 'temp_check', type: modal.type, ...newFields });
  } else if (modal.mode === 'edit') {
    proposedTx = proposedTx.map(t => t.id === modal.tx.id ? { ...t, ...newFields } : t);
  } else if (isConfirm) {
    if (isPartialConfirm) {
      proposedTx = proposedTx.map(t => t.id === modal.tx.id ? { ...t, amount: remainingAmount } : t);
      proposedTx.unshift({
        id: 'temp_confirmed',
        type: modal.tx.type,
        amount: amount,
        category: category,
        date: dateStr,
        status: 'confirmed',
        comment: comment,
        isParking: isParking,
        isParkingRefund: isParkingRefund
      });
    } else {
      proposedTx = proposedTx.map(t => t.id === modal.tx.id ? { ...t, ...newFields, status: 'confirmed' } : t);
    }
  }

  const sim = validateSimulatedState(proposedTx);
  if (sim.savings < 0) { showToast(`❌ Відхилено: Скарбничка піде в мінус (${fmt(sim.savings)} грн)`); return; }
  if (sim.wallet < 0) { showToast(`❌ Відхилено: Гаманець піде в мінус (${fmt(sim.wallet)} грн)`); return; }

  const currentCats = customCategories[modal.type] || [];
  if (!currentCats.some(c => c.toLowerCase() === category.toLowerCase())) {
    customCategories[modal.type] = [...currentCats, category]; saveCategories();
  } else {
    category = currentCats.find(c => c.toLowerCase() === category.toLowerCase()) || category;
  }

  if (modal.mode === 'create') {
    addTransaction({ type: modal.type, ...newFields, plannedDate: isPending ? dateStr : null });
    showToast(isPending ? '⏳ Заплановану операцію збережено!' : (isParking ? '🅿️ Витрату на парковку додано в облік!' : (isParkingRefund ? '↩️ Повернення успішно зараховано!' : '✅ Операцію успішно додано!')));
  } else if (modal.mode === 'edit') {
    updateTransaction(modal.tx.id, newFields);
    showToast('✅ Зміни успішно збережено!');
  } else if (isConfirm) {
    if (isPartialConfirm) {
      // 1. Оновлюємо очікувану операцію залишковою сумою (залишається в очікуваних)
      updateTransaction(modal.tx.id, {
        amount: remainingAmount,
        category: category,
        comment: comment || modal.tx.comment || ''
      });
      // 2. Додаємо підтверджену операцію на фактично отриману/сплачену частину
      const partLabel = comment ? `${comment} (частина)` : (modal.tx.comment ? `${modal.tx.comment} (частина)` : `Частина очікуваної суми`);
      addTransaction({
        type: modal.tx.type,
        amount: amount,
        category: category,
        date: dateStr,
        status: 'confirmed',
        confirmedAt: dateStr,
        comment: partLabel,
        isParking: isParking,
        isParkingRefund: isParkingRefund
      });
      showToast(`✅ Зараховано ${fmt(amount)} грн! Залишок ${fmt(remainingAmount)} грн чекає в очікуваних ⏳`);
    } else {
      updateTransaction(modal.tx.id, { ...newFields, status: 'confirmed', confirmedAt: dateStr });
      showToast('✅ Операцію успішно підтверджено повністю!');
    }
  }
  closeModal();
}

                <span style="margin-left:6px; color:var(--text-secondary);">${escapeHtml(h.comment || (h.isParking ? 'Парковка' : 'Повернення'))}</span>
                <div style="font-size:11px; color:var(--text-tertiary); margin-top:2px;">${escapeHtml(h.date)}</div>
              </div>
              <div style="font-family:'Sora',sans-serif; font-weight:700; color:${h.isParking ? 'var(--expense)' : 'var(--income)'}">
                ${h.isParking ? '−' : '+'}${fmt(h.amount)} грн
              </div>
            </div>
          `).join('') : '<div class="empty-state">Історія парковок порожня</div>'}
        </div>
      ` : ''}
    </div>

  `;

  if (monthPending.length > 0) {
    htmlStr += `
    <section class="list-section">
      <h2 class="section-title">Очікувані операції ⏳</h2>
      <div class="list-item" style="padding:4px 16px">
    `;
    htmlStr += monthPending.map(t => {
      const isInc = t.type === 'income'; const sign = isInc ? '+~' : '−~'; const amtClass = isInc ? 'income' : 'expense';
      return `<div class="tx-row" data-id="${escapeHtml(t.id)}"><div class="tx-meta"><div class="tx-cat">${iconFor(t.category)} ${escapeHtml(t.category)} <span style="font-size:12px; color:var(--accent); font-weight:normal">(${isInc ? 'дохід' : 'витрата'})</span></div><div class="tx-date">План: ${escapeHtml(t.date)}</div></div><div class="tx-right"><div class="list-item-amount ${amtClass}">${sign}${fmt(t.amount)} грн</div><button class="tx-btn confirm-btn" data-id="${escapeHtml(t.id)}" title="Підтвердити факт">✅</button><button class="tx-btn edit-tx" data-id="${escapeHtml(t.id)}" title="Редагувати">✏️</button><button class="tx-btn del-tx" data-id="${escapeHtml(t.id)}" title="Видалити">✕</button></div></div>`;
    }).join('');
    htmlStr += `
      </div>
    </section>
    `;
  }

  htmlStr += `
    <section class="list-section">
      <h2 class="section-title">Загальні заощадження</h2>
      <div class="list-item"><div class="list-item-top"><div class="list-item-name">🏦 Відкладено всього</div><div class="list-item-amount" style="color:var(--save)">${fmt(totalSavedAllTime)} грн</div></div></div>
    </section>

    <section class="list-section">
      <h2 class="section-title">Доходи за місяць</h2>
  `;
  htmlStr += incomeGroups.length ? incomeGroups.map(([cat, amt]) => `<div class="list-item"><div class="list-item-top"><div class="list-item-name">${iconFor(cat)} ${escapeHtml(cat)}</div><div class="list-item-amount income">+${fmt(amt)} грн</div></div><div class="pct-label">${income ? Math.round(amt / income * 100) : 0}% від усіх доходів</div><div class="bar-track"><div class="bar-fill income" style="width:${maxIncomeCat ? (amt / maxIncomeCat * 100) : 0}%"></div></div></div>`).join('') : '<div class="empty-state">Ще немає доходів за цей місяць</div>';
  
  htmlStr += `</section><section class="list-section"><h2 class="section-title">Витрати по категоріях</h2>`;
  htmlStr += expenseGroups.length ? expenseGroups.map(([cat, amt]) => `<div class="list-item"><div class="list-item-top"><div class="list-item-name">${iconFor(cat)} ${escapeHtml(cat)}</div><div class="list-item-amount expense">${fmt(amt)} грн</div></div><div class="pct-label">${expense ? Math.round(amt / expense * 100) : 0}% від усіх витрат</div><div class="bar-track"><div class="bar-fill expense" style="width:${maxExpenseCat ? (amt / maxExpenseCat * 100) : 0}%"></div></div></div>`).join('') : '<div class="empty-state">Ще немає витрат за цей місяць</div>';
  
  htmlStr += `
    </section>
    <section class="list-section">
      <h2 class="section-title">Останні операції</h2>
      <div class="list-item scroll-area">
  `;
  htmlStr += recentTx.length ? recentTx.map(t => {
    const isPending = t.status === 'pending'; const sign = isPending ? '⏳ ' : (t.type === 'income' ? '+' : t.type === 'expense' ? '−' : t.type === 'save' ? '🏦 ' : '↩ '); const amtClass = isPending ? 'pending' : (t.type === 'income' ? 'income' : t.type === 'expense' ? 'expense' : '');
    return `<div class="tx-row" data-id="${escapeHtml(t.id)}"><div class="tx-meta"><div class="tx-cat">${iconFor(t.category)} ${escapeHtml(t.category)} ${t.comment ? `<span style="font-size:12px;color:var(--text-secondary)">(${escapeHtml(t.comment)})</span>` : ''}</div><div class="tx-date">${escapeHtml(t.date)} ${t.isParking ? '• <span style="color:var(--accent)">🅿️ парковка</span>' : (t.isParkingRefund ? '• <span style="color:var(--income)">↩️ повернення</span>' : '')} ${isPending ? '• <i>не зараховано</i>' : ''}</div></div><div class="tx-right"><div class="list-item-amount ${amtClass}">${sign}${fmt(t.amount)} грн</div><button class="tx-btn edit-tx" data-id="${escapeHtml(t.id)}" title="Редагувати">✏️</button><button class="tx-btn del-tx" data-id="${escapeHtml(t.id)}" title="Видалити">✕</button></div></div>`;
  }).join('') : '<div class="empty-state">Немає операцій у цьому місяці</div>';
  htmlStr += `
      </div>
    </section>
    <div class="backup-row">
      <button class="backup-btn" onclick="setupStartingBalance()">💰 Стартовий капітал: ${fmt(startingBalance)} грн</button>
    </div>
    <div class="backup-row">
      <button class="backup-btn" onclick="exportData()">⬇ Зберегти бекап</button>
      <button class="backup-btn" onclick="document.getElementById('import-input').click()">⬆ Відновити з файлу</button>
    </div>
    <div class="backup-row">
      <button class="backup-btn" onclick="setupCloudBackup()">☁️ ${backupUrl ? 'Хмара підключена' : 'Підключити хмару'}</button>
      <button class="backup-btn" onclick="restoreFromCloud()">☁️⬇ З хмари</button>
    </div>
    <div class="backup-row">
      <button class="backup-btn" onclick="setupTelegram()">✈️ ${telegramConfig ? 'Telegram підключено' : 'Підключити Telegram'}</button>
      <button class="backup-btn" onclick="telegramSyncNow(); showToast('✈️ Відправлено в Telegram')">✈️⬆ Надіслати зараз</button>
    </div>
    <div class="backup-row">
      <button class="backup-btn" onclick="forceAppUpdate()" style="color: var(--expense)">🔄 Оновити додаток (Скинути кеш)</button>
    </div>
    <input id="import-input" type="file" accept="application/json" style="display:none" onchange="importData(event)">
  `;

  if (modal) { htmlStr += renderModal(); }
  if (toast) { htmlStr += `<div class="toast">${escapeHtml(toast)}</div>`; }

  app.innerHTML = htmlStr;

  document.querySelectorAll('.edit-tx').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(btn.dataset.id); }); });
  document.querySelectorAll('.confirm-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openConfirmModal(btn.dataset.id); }); });
  document.querySelectorAll('.del-tx').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); deleteTransaction(btn.dataset.id); }); });
  document.querySelectorAll('.tx-row').forEach(row => { row.addEventListener('click', (e) => { if (e.target.closest('button')) return; openEditModal(row.dataset.id); }); });
  attachModalListeners();
}

function exportData() {
  const payload = { transactions, customCategories, startingBalance };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `finance-backup-${toLocalDateString(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✅ Бекап успішно завантажено');
}

function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      startingBalance = typeof parsed.startingBalance === 'number' ? parsed.startingBalance : 0;
      saveStartingBalance(startingBalance);

      transactions = Array.isArray(parsed) ? parsed : (parsed.transactions || []);
      saveData();

      if (parsed.customCategories) {
        customCategories = parsed.customCategories;
        saveCategories();
      }

      render();
      showToast('✅ Дані успішно відновлено начисто!');
    } catch (e) { showToast('❌ Не вдалося прочитати файл бекапу'); }
  };
  reader.readAsText(file); event.target.value = '';
}

function renderModal() {
  const isConfirm = modal.mode === 'confirm'; const isEdit = modal.mode === 'edit'; const isCreate = modal.mode === 'create';
  let title = modal.title || 'Операція';
  if (!modal.title) {
    if (isConfirm) title = modal.tx.type === 'income' ? 'Підтвердити отримання' : 'Підтвердити витрату';
    else if (isEdit) title = 'Редагувати запис';
    else title = { income: 'Новий дохід', expense: 'Нова витрата', save: 'Відкласти кошти', take: 'Взяти із заощаджень' }[modal.type];
  }

  const tx = modal.tx || {}; 
  const currentAmount = tx.amount || modal.defaultAmount || ''; 
  const currentDate = tx.date || toLocalDateString(new Date());
  const currentComment = tx.comment || '';
  const isPending = tx.status === 'pending';
  const opts = customCategories[modal.type] || []; 
  const selectedCat = modal.forcedCategory || tx.category || opts[0] || '';

  let modalHtml = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <h3 class="sheet-title">${title}</h3>
      <form onsubmit="submitModal(event)">
        <div class="field">
          <label>${isConfirm ? `Фактична сума до зарахування, грн (всього очікується: ${fmt(tx.amount)} грн)` : 'Сума, грн'}</label>
          <input id="amount-input" name="amount" type="text" inputmode="decimal" value="${escapeHtml(currentAmount)}" placeholder="0" required autocomplete="off" ${isConfirm ? `oninput="updatePartialHint(this.value, ${tx.amount})"` : ''}>
          ${isConfirm ? `<div id="partial-hint" style="font-size:12.5px; color:var(--accent); margin-top:6px; display:none;"></div>` : ''}
        </div>
        <div class="field">
          <label>${isConfirm ? 'Фактична дата проведення' : 'Дата'}</label>
          <input name="tx-date" type="date" value="${isConfirm ? toLocalDateString(new Date()) : escapeHtml(currentDate)}" required>
        </div>
        <div class="field">
          <label>Коментар / Примітка (необовʼязково)</label>
          <input name="tx-comment" type="text" value="${escapeHtml(currentComment)}" placeholder="Наприклад: Паркінг ТРЦ, повернення від колеги">
        </div>
  `;
  if (modal.type === 'expense') {
    modalHtml += `
      <div class="field">
        <label class="field-checkbox">
          <input type="checkbox" name="is-parking-check" ${(modal.isParking || tx.isParking) ? 'checked' : ''}>
          <span>🅿️ Очікує повернення (парковка / борг)</span>
        </label>
      </div>
    `;
  }
  if (isCreate && (modal.type === 'income' || modal.type === 'expense')) {
    modalHtml += `<div class="field"><label class="field-checkbox"><input type="checkbox" name="is-pending"><span>Запланована операція (ще не проведено)</span></label></div>`;
  }
  if (isEdit && (modal.tx.type === 'income' || modal.tx.type === 'expense')) {
    modalHtml += `<div class="field"><label class="field-checkbox"><input type="checkbox" name="is-pending" ${isPending ? 'checked' : ''}><span>Очікує розрахунку (план)</span></label></div>`;
  }
  
  modalHtml += `
        <div class="field">
          <label>Категорія (група)</label>
          <input type="hidden" name="category" id="category-hidden" value="${escapeHtml(selectedCat)}">
          <div class="chip-grid" id="chip-grid">
  `;
  modalHtml += opts.map((o) => `<span class="chip-wrap"><button type="button" class="chip chip-select ${o === selectedCat ? 'active' : ''}" data-cat="${escapeHtml(o)}">${iconFor(o)} ${escapeHtml(o)}</button><button type="button" class="chip-del" data-cat="${escapeHtml(o)}">×</button></span>`).join('');
  modalHtml += `
            <button type="button" class="chip" id="chip-custom-btn">✏️ Своя</button>
          </div>
          <input name="custom-category" id="custom-category-input" type="text" placeholder="Введіть назву категорії" style="display:none; margin-top:10px;">
        </div>
        <div class="sheet-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal()">Скасувати</button>
  `;
  if (isEdit) {
    modalHtml += `<button type="button" class="btn btn-danger" onclick="if(confirm('Видалити цей запис?')){ deleteTransaction('${tx.id}'); closeModal(); }">Видалити</button>`;
  }
  modalHtml += `
          <button type="submit" class="btn btn-confirm ${isConfirm ? (modal.tx.type === 'income' ? 'income' : 'expense') : (isEdit ? 'edit' : modal.type)}">${isConfirm ? 'Зарахувати' : (isEdit ? 'Зберегти' : 'Додати')}</button>
        </div>
      </form>
    </div>
  </div>`;
  
  return modalHtml;
}

function changeMonth(delta) { monthOffset += delta; render(); }

loadData(); loadBackupUrl(); loadTelegramConfig();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(err => console.warn(err)); }
</script>
</body>
</html>
